{% extends "base_super_pgd2.html" %}

{% block content %}

    {{ block.super }}

    {% if token %}
        <p class="alert alert-info"> Token gerado com sucesso ({{ URL_API }}) </p>
    {% else %}
        <p class="alert alert-danger"> Token não foi gerado ({{ URL_API }}) </p>
    {% endif %}

    {% if erro_token %}
        {% box 'Erro' %}
            {{ erro_token }}
        {% endbox %}    
    {% endif %}

{% endblock %}
