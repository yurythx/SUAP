<div class="table-responsive">
    <table>
        <thead>
            <tr>
                <th>Título</th>
                <th>Descrição</th>
                <th class="no-print text-end">Opções</th>
            </tr>
        </thead>
        <tbody>
            {% for entrega in lista_dados_entregas %}
                <tr>
                    <td>
                        {{ entrega.titulo|format }}
                    </td>
                    <td>
                        {{ entrega.descricao|linebreaks }}
                    </td>
                    <td class="no-print">
                        <ul class="action-bar">
                            <li>
                                <a href="/pgd2/analisar_pes_detalhado_entrega/{{ entrega.id }}" class="btn {% if entrega.entrega_analise %}primary{% else %}success{% endif %}">
                                    {% if entrega.entrega_analise %}
                                        Editar análise
                                    {% else %}
                                        Analisar
                                    {% endif %}
                                </a>
                            </li>
                        </ul>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
