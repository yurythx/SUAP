{% extends super_template %}

{% block content %}

    {% if not pode_solicitar and erros %}
        <div class="alert alert-danger">
            <p><strong>Atenção</strong>:</p>
            <ol>
                {% for erro in erros %}
                    <li>{{ erro }}</li>
                {% endfor %}
            </ol>
        </div>
    {% else %}

        {% render_form form %}

    {% endif %}

{% endblock %}
