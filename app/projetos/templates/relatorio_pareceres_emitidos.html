{% extends super_template %}

{% block content %}

    <div class="search-and-filters">
        {% render_form form %}
    </div>
    {% if form.is_bound %}
        <p class="alert alert-warning"> Nenhuma avaliação encontrada.</p>
    {% else %}
        <p class="alert alert-warning">Utilize os filtros para gerar o relatório.</p>
    {% endif %}
{% endblock %}
