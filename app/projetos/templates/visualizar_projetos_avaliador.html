{% extends super_template %}

{% block content %}

    <div class="table-responsive">
        <table>
            <caption>Projetos avaliados</caption>
            <thead>
                <tr>
                    <th>Campus</th>
                    <th>Edital</th>
                    <th>Projeto</th>
                    <th>Data da avaliação</th>
                </tr>
            </thead>
            <tbody>
            {% for avaliacao in avaliacoes %}
                <tr>
                    <td>{{ avaliacao.projeto.uo.sigla }}</td>
                    <td>{{ avaliacao.projeto.edital.titulo }}</td>
                    <td>{{ avaliacao.projeto.titulo }}</td>
                    <td>{{ avaliacao.data|format }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
