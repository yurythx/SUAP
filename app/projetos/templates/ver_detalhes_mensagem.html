{% extends super_template %}

{% block content %}

     <dl class="definition-list flex">
        <div class="list-item flex-basis-50">
            <dt>Título</dt>
            <dd>{{ msg.titulo|format|sanitize }}</dd>
        </div>
        <div class="list-item flex-basis-50">
            <dt>Enviado por</dt>
            <dd>{{ msg.cadastrado_por.user|format }} em <small>{{ msg.cadastrado_em|format }}</small></dd>
        </div>
        <div class="list-item flex-basis-100">
            <dt>Conteúdo</dt>
            <dd>{{ msg.conteudo|format|sanitize }}</dd>
        </div>
        <div class="list-item flex-basis-100">
            <dt>Destinatários</dt>
            <dd>{{ msg.destinatarios }}</dd>
        </div>
    </dl>

{% endblock %}
