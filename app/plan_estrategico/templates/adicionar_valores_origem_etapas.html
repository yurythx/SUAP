{% extends super_template %}

{% block content %}

    {% box 'Origem de Recurso' %}
        <div class="table-responsive">
            <dl class="definition-list">
                <dt>Descrição</dt>
                <dd>{{ origemrecurso }}</dd>
                <dt>Valor Total</dt>
                <dd> R$ {{ origemrecurso.get_valor|format_money }}</dd>
            </dl>
        </div>
    {% endbox %}
    {% box 'Componentes funcionais' %}
        {% render_form form %}
    {% endbox %}
{% endblock %}
