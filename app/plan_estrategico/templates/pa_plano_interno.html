{% block tabs %}
    {% if plano_interno_pode_gerenciar %}
        <ul class="action-bar">
            <li><a href="{% url 'planoatividade_planointerno_add' plano_atividade.id %}" class="btn popup success">Adicionar Plano Interno</a></li>
        </ul>
    {% endif %}
    {% if plano_interno %}
        <table>
            <thead>
                <tr>
                    <th>Plano Interno</th>
                </tr>
            </thead>
            <tbody>
                {% for plano in plano_interno %}
                    <tr>
                        <td> {{ plano }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p class="alert alert-warning">Nenhum plano interno foi criado para este plano de atividades.</p>
    {% endif %}
{% endblock %}
