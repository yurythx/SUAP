{% if objects %}
	<table>
		<thead>
			<tr>
			<th><input type="checkbox" onchange="var is = this.parentNode.parentNode.parentNode.parentNode.parentNode.getElementsByTagName('input');for(var i=0; i<is.length; i++) is[i].checked = this.checked"/></th>
			<th>Código</th>
			<th>Descrição</th>
			</tr>
		</thead>
		<tbody>
			{% for ri in objects %}
				<tr>
					<td>{{ ri.widget }}</td>
					<td>{{ ri.codigo }}</td>
					<td>{{ ri.descricao }}</td>
				</tr>
			{% endfor %}
		</tbody>
	</table>
{% else %}
    <p class="alert alert-warning">Nenhum plano interno criado.</p>
{% endif %}
