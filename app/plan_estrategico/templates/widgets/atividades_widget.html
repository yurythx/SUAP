{% if objects %}
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                <th><input type="checkbox" onchange="var is = this.parentNode.parentNode.parentNode.parentNode.parentNode.getElementsByTagName('input');for(var i=0; i<is.length; i++) is[i].checked = this.checked"/></th>
                <th>Atividade</th>
                <th>Elemento de Despesa</th>
                </tr>
            </thead>
            <tbody>
                {% for ri in objects %}
                    <tr>
                        <td>{{ ri.widget }}</td>
                        <td>{{ ri.atividadeetapa.descricao }}</td>
                        <td>{{ ri.atividadeetapa.nome }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endif %}
