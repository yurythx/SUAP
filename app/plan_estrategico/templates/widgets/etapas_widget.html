{% if objects %}
        <table>
        	<thead>
	        	<tr>
                   <th>
                        <input type="checkbox" id="check-all" />
                    </th>

                    <script>
                    document.getElementById("check-all").onchange = function() {
                        var is = this.closest("table").getElementsByTagName("input");
                        for (var i = 0; i < is.length; i++) {
                            is[i].checked = this.checked;
                        }
                    };
                    </script>
                    <th>Código</th>
                    <th>Descrição</th>
	        	</tr>
        	</thead>
        	<tbody>
        		{% for ri in objects %}
                    <tr>
                        <td>{{ ri.widget }}</td>
                        <td>{{ ri.codigo }}</td>
                        <td>{{ ri.descricao }}</td>
                    </tr>
        		{% endfor %}
        	</tbody>
        </table>
{% else %}
    <p class="alert alert-warning">Nenhum componente funcional do macroprocesso disponível para este plano de atividades</p>
{% endif %}
