{% if objects %}
        <table>
        	<thead>
	        	<tr>
	        	<th><input type="checkbox" onchange="var is = this.parentNode.parentNode.parentNode.parentNode.parentNode.getElementsByTagName('input');for(var i=0; i<is.length; i++) is[i].checked = this.checked"/></th>
	        	<th>Gestor Sistêmico</th>
	        	</tr>
        	</thead>
        	<tbody>
        		{% for ri in objects %}
        		<tr>
        			<td>{{ ri.widget }}</td>
        			<td>{{ ri }}</td>
        		</tr>
        		{% endfor %}
        	</tbody>
        </table>
{% else %}
    <p class="alert alert-warning">Nenhuma unidade gestora criada para o macroprocesso</p>
{% endif %}
