<table>
    <caption><span id="count_qs">{{ qs|length }}</span> opções disponíveis para seleção</caption>
    <tbody>
        {% for obj in qs %}
            <tr>
                <td>{{ obj|radio_input:obj.checked_|safe }} {{ obj|input_label|safe }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
