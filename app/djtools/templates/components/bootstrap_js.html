{% load static %}
{# Bootstrap 6 é só ESM: fora do pipeline (o wrapper e o JSMin quebram o `export`). O módulo roda adiado e a data API dele é delegada; #}
{# expor o bundle em `window.bootstrap` deixa os scripts clássicos criarem instâncias (o teclado das abas só existe na instância). #}
<script type="module">
    import * as bootstrap from '{% static 'djtools/js/bootstrap.bundle.min.js' %}';
    window.bootstrap = bootstrap;
    document.dispatchEvent(new Event('bootstrap:ready'));
</script>
