<div class="modulo modulo-alertas">
    <h3>
        {{ titulo }}
        <div class="dropdown">
            <button class="button-quadro dropdown-toggle" type="button" data-bs-toggle="menu" aria-expanded="false">
                {% icone "bars" %}
                <span class="visually-hidden">Ações</span>
            </button>
            <div class="dropdown-menu menu">
                <button class="dropdown-item menu-item">Recarregar alertas</button>
            </div>
        </div>
    </h3>
    <ul>
        {% for objeto in objetos %}
            <li>
                <a href="{{ objeto.url }}" class="indicator {{ classe }}">
                    <span class="indicator-number fas fa-{{ icone }}" aria-hidden="true"></span>
                    <span class="indicator-description">
                        <span class="indicador-title">{{ objeto.titulo|safe }}</span>
                        {% if objeto.prazo %}<span class="indicator-extra-info">{% icone "calendar-alt" %} Até {{ objeto.prazo }}</span>{% endif %}
                        {% if objeto.extra %}<span class="indicator-extra-info">{{ objeto.extra }}</span>{% endif %}
                    </span>
                </a>
            </li>
        {% endfor %}
    </ul>
</div>
