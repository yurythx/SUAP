{% with box_id=boxid|default:title|slugify %}
    <div class="accordion {% if class %}{{ class }}{% endif %}">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button
                    class="accordion-button {% if 'collapsed' in class %}collapsed{% endif %}"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#{{ box_id }}"
                    aria-expanded="{% if 'collapsed' in class %}false{% else %}true{% endif %}"
                    aria-controls="{{ box_id }}"
                    >
                    {{ title }}
                    {% if badge %}<span class="badge">{{ badge }}</span>{% endif %}
                    {% if extra %}<span class="extra">{{ extra }}</span>{% endif %}
                </button>
            </h2>
            <div
                id="{{ box_id }}"
                class="accordion-collapse collapse {% if 'collapsed' not in class %}show{% endif %}"
                >
                <div class="accordion-body">{{ content }}</div>
            </div>
        </div>
    </div>
{% endwith %}
