<script>
    function dateRangeInputInit(lookup, value) {
        if (value) {
            // value = "dd/mm/aaaa" (Non-ISO string)
            // value = "aaaa-mm-dd" (ISO string)
            let isISOString = `${value}`.indexOf('-') >= 0;
            if (isISOString) {
                $(lookup).val(value);
            } else {    
                let [dd, mm, aaaa] = `${value}`.split('/');
                $(lookup).val(`${aaaa}-${mm}-${dd}`);
            }
            $(lookup).addClass("datainformada");
        }
        $(lookup).focusout(dateRangeInputFocusOut);
    }

    function dateRangeInputFocusOut(ev) {
        let lookup = ev.target;
        let value = $(lookup).val();
        if (value) {
            $(lookup).addClass("datainformada");
        } else {
            $(lookup).removeClass("datainformada");
        }
    }

    $(document).ready(function() {
        dateRangeInputInit($("#id_drf__{{ choices.0.field_path }}__gte"), "{{ choices.0.value }}");
        dateRangeInputInit($("#id_drf__{{ choices.1.field_path }}__lte"), "{{ choices.1.value }}");
    });
</script>

<style>
    .filter.daterangefilter {
        flex-basis: 250px;
        max-width: 250px;
    }

    .filter.daterangefilter input[type="date"] {
        max-width: 120px; 
        min-width: 120px;
        color: #999;
    }
    
    .filter.daterangefilter input[type="date"].datainformada {
        color: #444;
    }    

    .filter.daterangefilter div.sep {
        display: block;
        float: left;  
        padding: 2px;
    }
</style>

<div class="filter daterangefilter">
    <label>{{ title }}:</label>
    
    <input id="id_drf__{{ choices.0.field_path }}__gte"
           name="drf__{{ choices.0.field_path }}__gte" type="date"
           title="A partir de" size="10"/>

    <div class="sep"></div>

    <input id="id_drf__{{ choices.1.field_path }}__lte"
           name="drf__{{ choices.1.field_path }}__lte" type="date"
           title="Até" size="10"/>
</div>
