{% include "widgets/input.html" %}

<script>
    // https://igorescobar.github.io/jQuery-Mask-Plugin/docs.html#basic-usage

    let {{ widget.name }}_elem = $('#id_{{ widget.name }}')

    let {{ widget.name }}_mask = $({{ widget.name }}_elem).data('mask')
    let {{ widget.name }}_patterns = $({{ widget.name }}_elem).data('patterns')
    let {{ widget.name }}_placeholder = '{{ widget.attrs.placeholder }}'

    let {{ widget.name }}_mask_options = {}
    
    if ({{ widget.name }}_placeholder) {
        {{ widget.name }}_mask_options['placeholder'] = {{ widget.name }}_placeholder
    }
    
    if ({{ widget.name }}_patterns) {
        let {{ widget.name }}_final_patterns = {}

        for (const k in {{ widget.name }}_patterns) {
            let regexp = {{ widget.name }}_patterns[k]['regexp']
            let optional = {{ widget.name }}_patterns[k]['optional']
            {{ widget.name }}_final_patterns[k] = {'pattern': new RegExp(regexp), 'optional': optional}
        }

        // https://igorescobar.github.io/jQuery-Mask-Plugin/docs.html#translation
        {{ widget.name }}_mask_options['translation'] = {{ widget.name }}_final_patterns  
    }

    $({{ widget.name }}_elem).mask({{ widget.name }}_mask, {{ widget.name }}_mask_options)
</script>
