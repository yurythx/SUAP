{% include "widgets/input.html" %}
<script>
    var dateInput = $("input[name='{{ widget.name }}']");
    dateInput.on('copy', function(){
        var value = convertDateISOToLocal($(this).val());
        navigator.clipboard.writeText(value);
    });
    dateInput.on('paste', function(e) {
        var value = convertDateLocalToISO(e.originalEvent.clipboardData.getData('text'));
        var pastedDate = new Date(value);
        if (isNaN(pastedDate)) {
            alert(`A data colada é inválida!`);
            return;
        }
        value = pastedDate.toISOString().substring(0,10)
        $(this).val(value);
    });
</script>
