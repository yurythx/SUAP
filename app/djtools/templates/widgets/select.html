{% if widget.attrs.readonly == 'readonly' %}

{% for group_name, group_choices, group_index in widget.optgroups %}
  {% for choice in group_choices %}
    {% if choice.attrs.selected == True %}
      <input name="{{ widget.name }}_" type="text" value="{{ choice.label }}" readonly="readonly">
      <input id="id_{{ widget.name }}" name="{{ widget.name }}" type="hidden" value="{{ choice.value|stringformat:'s' }}">
    {% endif %}
  {% endfor %} 
{% endfor %}
{% else %}
<select name="{{ widget.name }}" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" {% include "django/forms/widgets/attrs.html" %}>{% for group_name, group_choices, group_index in widget.optgroups %}{% if group_name %}
  <optgroup label="{{ group_name }}">{% endif %}{% for widget in group_choices %}
  {% include widget.template_name %}{% endfor %}{% if group_name %}
  </optgroup>{% endif %}{% endfor %}
</select>
{% endif %}
