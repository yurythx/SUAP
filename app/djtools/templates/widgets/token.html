<div class="token-input">
    <div class="input-and-buttons">
        <input type="{{ widget.type }}" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}>
        <div class="buttons">
            <a class="btn" href="/djtools/send_token/email/">Enviar novo Código por Email</a>
            {% if notifica_habilitado %}
                <a class="btn" href="/djtools/send_token/govbr/">Enviar novo Código por App do GovBR</a>
            {% endif %}
        </div>
    </div>
    <p class="alert alert-info">{{ message }}</p>
</div>

<script>
    let msg = $('.token-input .alert');
    msg.hide();
    $('.token-input .buttons a').click('click', (event) => {
        event.preventDefault();
        let url = event.target.href;
        $.ajax({
            method: "GET",
            url: url,
            success: function(result, textStatus, jqXHR) {
                msg.addClass('info');
                msg.removeClass('error');
                msg.text(result.message);
                msg.show();
            },
            error: function(result, textStatus, jqXHR) {
                msg.addClass('error');
                msg.removeClass('info');
                msg.text(result.responseJSON.message);
                msg.show();
            }
        });
    })
</script>
