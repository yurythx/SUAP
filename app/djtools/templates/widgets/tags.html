{% if widget.attrs.readonly %}
    {% if values %}
        {% for value in values %}
            <input type="hidden" class="form-control" id="{{ name }}_{{ id }}" name="{{ name }}" value="{{ value }}">
        {% endfor %}
        <input type="text" class="form-control" disabled readonly value="{{ values|join:', ' }}">
    {% else %}
        <input type="hidden" class="form-control" id="{{ name }}_{{ id }}" name="{{ name }}" value>
        <input type="text" class="form-control" disabled readonly value="{{ readonly_no_value_text }}">
    {% endif %}
{% else %}
    <select class="js-example-data-ajax form-control" id="{{ name }}_{{ id }}" name="{{ name }}" multiple="multiple">
        {% for value in values %}
            <option value="{{ value }}" selected="selected">{{ value }}</option>
        {% endfor %}
    </select>

    {% if side_html %}
        {{ side_html|safe }}
    {% endif %}

    <script>
    $(function(){
        var input = $("#{{ name }}_{{ id }}");
        input.select2({
            language: "pt-BR",
            allowClear: true,
            tags: true,
            placeholder: 'Digite sua opção e aperte Enter',
            escapeMarkup: function (markup) {
                return markup;
            }, // let our custom formatter work
            minimumInputLength: 0,
        }).on('select2:select', function (e) {
            if (input.val() !== null) {
                input.siblings().find('.select2-selection__rendered').addClass('option-selected');
            }
        }).on('select2:unselect', function (e) {
            if (input.val() === null) {
                input.siblings().find('.select2-selection__rendered').removeClass('option-selected');
            }
        });
    });
    </script>
{% endif %}

{% if help_text %}
    <span class="help">{{ help_text }}</span>
{% endif %}
