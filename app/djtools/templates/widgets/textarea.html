<textarea name="{{ widget.name }}" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" {% include "django/forms/widgets/attrs.html" %}>
{% if widget.value %}{{ widget.value }}{% endif %}</textarea>
{% if not widget.attrs.readonly %}
    <p class="help grid-area-extra" title="Quantidade de caracteres informados"><span class="textarea-counter">0</span> caracteres informados.</p>
{% endif %}
