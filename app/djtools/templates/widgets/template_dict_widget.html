<input type="hidden" name="{{ name }}" id="id_{{ name }}" value="{{ value }}">
{% if error_message %}
    <ul class="errorlist"><li>{{ error_message }}</li></ul>
{% endif %}
<div id="{{ name }}_container">
    <table>
        <tr>
            <th></th>
            {% for k in header %}
                <th align="right">{{ k }}</th>
            {% endfor %}
        </tr>
    {% for item in items %}
        <tr>
            <td>{{ forloop.counter }}</td>
            {% for v in item.values %}
                <td align="right">{{ v }}</td>
            {% endfor %}
        </tr>
    {% endfor %}
    </table>
</div>
<script>
    $("#{{ name }}_container").find('input').change(function(){
        var values = $("#{{ name }}_container").find('input').map(function() {return $(this).val();}).get();
        $("#id_{{ name }}").val(values.join("|"));
    });
</script>
