{% if qs %}
<div class="table-responsive">
<table>
    <caption>{{ qs|length }} opções disponíveis para seleção</caption>
    <tbody>
        {% for obj in qs %}
        <tr>
            <td>{{ obj|checkbox_input:obj.checked_|safe }}{{ obj|input_label|safe }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% else %}
    <p class="alert alert-warning">Nenhum resultado encontrado.</p>
{% endif %}
