{% block extrahead %}
    <style>
        form #id_{{ name }}_select_days_input_container {
            grid-area: input;
        }
    </style>
{% endblock %}

<div id="id_{{ name }}_select_days_input_container">
    {% if can_select_all %}
        <select
            id="id_{{ name }}"
        >
            <option value="empty">{{ label_empty_select }}</option>
            <option value="all" {% if all_selected %}selected{% endif %}>{{ label_all_select }}</option>
            <option value="custom" {% if any_day_selected %}selected{% endif %}>{{ label_custom_select }}</option>
        </select>
    
        <input
            id="id_{{ name }}_all" 
            name="{{ name }}_all" 
            type="checkbox" 
            value="{% if all_selected %}on{% else %}off{% endif %}"
            {% if all_selected %}checked{% endif %}
            hidden
        />
    {% endif %}

    <div id="id_{{ name }}_custom_select_days_choices_container" {% if can_select_all and not any_day_selected %}hidden{% endif %}>
        <dl class="definition-list flex">
            {% for day, day_selected in days_choices.items %}
                <div class="list-item">
                    <dt>
                        <label for="id_{{ name }}_day_{{ day|date:'dmY' }}">{{ label_day_prefix }} {{ day|date:'d/m/Y' }}</label>
                    </dt>
                    <dd>
                        <input 
                            id="id_{{ name }}_day_{{ day|date:'dmY' }}" 
                            name="{{ name }}_day_{{ day|date:'dmY' }}" 
                            class="{{ name }}_day" 
                            type="checkbox"
                            value="{% if day_selected %}on{% else %}off{% endif %}"
                            {% if day_selected %}checked{% endif %}
                        />
                    </dd>
                </div>
            {% endfor %}
        </dl>
    </div>
</div>

<script>
    jQuery(document).ready(function () {
        jQuery('select#id_{{ name }}').change(function() {
            const selectedOption = jQuery(this).val()
            if (selectedOption === "all") {
                jQuery('#id_{{ name }}_all').val("on")
                jQuery("#id_{{ name }}_all").prop("checked", true)
                jQuery("#id_{{ name }}_custom_select_days_choices_container").prop('hidden', true);
                jQuery('.{{ name }}_day').val("off")
                jQuery(".{{ name }}_day").prop("checked", false)
            } else if (selectedOption === "custom") {
                jQuery('#id_{{ name }}_all').val("off")
                jQuery("#id_{{ name }}_all").prop("checked", false);
                jQuery("#id_{{ name }}_custom_select_days_choices_container").prop('hidden', false);
            } else {
                jQuery('#id_{{ name }}_all').val("off")
                jQuery("#id_{{ name }}_all").prop("checked", false);
                jQuery("#id_{{ name }}_custom_select_days_choices_container").prop('hidden', true);
                jQuery('.{{ name }}_day').val("off")
                jQuery(".{{ name }}_day").prop("checked", false)
            }
        })

        jQuery('.{{ name }}_day').click(function() {
            const isChecked = jQuery(this).is(":checked")
            if (isChecked) {
                jQuery(this).val("on")
                jQuery(this).prop('checked', true)
            } else {
                jQuery(this).val("off")
                jQuery(this).prop('checked', false)
            }
        })
    })
</script>
