{% extends super_template %}

{% block content %}
{% box "Documento Alvo" %}
    <dl class="definition-list flex">
        <div class="list-item">
            <dt>Identificador</dt>
            <dd><a href="{{ original.get_absolute_url }}">{{ original.identificador }}</a></dd>
        </div>
        <div class="list-item">
            <dt>Tipo</dt>
            <dd>{{ original.tipo }}</dd>
        </div>
        <div class="list-item">
            <dt>Setor responsável</dt>
            <dd>{{ original.setor_dono }}</dd>
        </div>
        <div class="list-item">
            <dt>Nível de acesso</dt>
            <dd>{{ original.get_nivel_acesso_display }}</dd>
        </div>
    </dl>
{% endbox %}

{% render_form form %}
{% endblock %}
