{% extends super_template %}

{% block content %}

    <form method="post">
        {% csrf_token %}
        <table>
            <thead>
            <tr>
                <th class="no-print">
                    <input type="checkbox" onchange="var is = this.parentNode.parentNode.parentNode.parentNode.getElementsByTagName('input');for(var i=0; i<is.length; i++) is[i].checked = this.checked" />
                </th>
                <th>Prazo</th>
                <th>Gatilho</th>
                <th>Ação</th>
                <th>Recorrente?</th>
            </tr>
            </thead>
            <tbody>
            {% for item in itens %}
                <tr>
                    <td class="no-print"><input value="{{ item.id }}" name="pre_configuracao_ids" type="checkbox" /></td>
                    <td>{{ item.prazo }}</td>
                    <td>{{ item.gatilho_ou_subtipo }}</td>
                    <td>{{ item.acao }}</td>
                    <td>{{ item.recorrente|format }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
        <div class="submit-row">
            <input type="submit" class="danger no-confirm" id="btn_salvar" value="Salvar" />
        </div>
    </form>

{% endblock %}
