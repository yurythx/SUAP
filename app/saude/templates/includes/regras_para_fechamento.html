{% if not atendimento.is_fechado and not atendimento.is_cancelado %}
    <details open="open">
        <summary>Regras para fechamento</summary>
        <div class="details-container">
            {% for pendencia in pendencias %}
                <p class="checklist error">{{ pendencia }}</p>
            {% empty %}
                <p class="checklist success">Este atendimento já pode ser fechado.</p>
            {% endfor %}
        </div>
    </details>
{% endif %}
