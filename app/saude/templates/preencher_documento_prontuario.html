{% extends super_template %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% render_form form render_full=False submit_label=False %}

        <div class="submit-row">
            <input type="submit" name="{{ form.ID }}" class="btn {{ form.SUBMIT_STYLE|default:'success'}}" value="{{ form.SUBMIT_LABEL|default:'Enviar' }}" />
            <a class="btn default pre-visualizar" href="#">Pré-visualizar</a>
        </div>
    </form>
{% endblock %}
