{% extends super_template %}

{% block extrahead %}
<script src="/static/djtools/graficos/highcharts.js"></script>
<script src="/static/djtools/graficos/exporting.js"></script>
<script>
    {% for grafico in graficos %}
        {{ grafico|safe }}
    {% endfor %}
</script>
{% endblock %}

{% block content %}

    <div class="search-and-filters">
        {% render_form form %}
    </div>

    <div class="graficos-container">
        {% for grafico in graficos_id %}
            <div id="{{ grafico }}" class="grafico-item"></div>
        {% endfor %}
        <div id="grafico7" class="grafico-item"></div>
    </div>

{% endblock %}
