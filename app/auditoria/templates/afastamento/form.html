{% extends super_template %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% render_form form render_full=False submit_label=False %}
        <div class="form-actions">
            {% if not readonly %}
                <button type="submit" class="btn success">Salvar</button>
            {% endif %}
            {% if form.instance.pk and form.instance|method:"pode_remover"|call:request.user %}
                <a href="{% url 'auditoria:remover_afastamento' afastamento.id %}"  class="btn danger">
                    Deletar
                </a>
            {% endif %}
            <button type="button" onclick="parent.close_fancybox_noreload('Cancelado pelo usuário', 'info')" class="btn primary">
                Voltar
            </button>
        </div>
    </form>
{% endblock %}
