{% extends super_template %}

{% block extrahead %}
<script>
    $(document).ready(function () {
        var motivoSelect = $('select[name="motivacao"]');
        var descricaoOutros = $('#id_descricao_outros').parent();

        function toggleDescricaoOutros() {
            var texto = $(this).find("option:selected").text(); 
            if (texto === 'Outros') {
                descricaoOutros.show();
            } else {
                descricaoOutros.hide();
            }
        }

        toggleDescricaoOutros(); // Mostrar/ocultar inicialmente com base na seleção atual

        motivoSelect.change(toggleDescricaoOutros); 
    });
</script>

{% endblock %}

{% block content %}
    {% render_form form %}
{% endblock %}
