{% extends super_template %}

{% block extrahead %}
<script>
    $(document).ready(function () {
        var tipoSelect = $('select[name="tipo"]');
        var prazo = $('#id_prazo').parent();

        function toggleDescricaoOutros() {
            if (tipoSelect.val() === 'SP') {
                prazo.show();
            } else {
                prazo.hide();
            }
        }

        toggleDescricaoOutros(); // Mostrar/ocultar inicialmente com base na seleção atual

        tipoSelect.change(toggleDescricaoOutros);
    });
</script>

{% endblock %}

{% block content %}
    {% render_form form %}
{% endblock %}
