{% extends super_template %}

{% block action-bar %}
    {% if perms.ppc.change_comissaoptdem %}
        <ul class="action-bar">
            <li><a class="btn primary" href="/admin/ppc/comissaoptdem/{{comissao.id }}/change/">Editar</a></li>
        </ul>
    {% endif %}
{% endblock %}

{% block content %}
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Servidores</th>
                </tr>
            </thead>
            <tbody>
                {% for servidor in comissao.servidores.all %}
                    <tr>
                        <td>{{ servidor}}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
