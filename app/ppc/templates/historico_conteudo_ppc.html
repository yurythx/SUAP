{% extends super_template %}
{% block content %}
    {% autopaginate logs 20 %}
        <table>
            <thead>
            <tr>
                <th>Usuário</th>
                <th>Data</th>
                <th>Alteração</th>
            </tr>
            </thead>
            <tbody>
            {% for log in logs %}
                <tr>
                    <td>{{ log.user|format }}</td>
                    <td>{{ log.dt|format }}</td>
                    <td>{{ log.get_resumo|format }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
        {% paginate %}

{% endblock %}
