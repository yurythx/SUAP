<dl class="definition-list">
    <div class="list-item flex-basis-100">
        <dt>Curso:</dt>
        <dd>{{ nome_curso }}</dd>
    </div>
    <div class="list-item">
        <dt>Disciplina:</dt>
        <dd>{{ plano.nome_disciplina }}</dd>
    </div>
    <div class="list-item">
        <dt>Carga horária:</dt>
        <dd>{{ plano.ch_disciplina }}h</dd>
    </div>
</dl>
<hr>
<h2 class="pdf-title">Ementa</h2>
<p>{{ plano.ementa|safe }}</p>
<h2 class="pdf-title">Programa</h2>
{% for secao in secoes %}
    <div>
        <h3 class="pdf-caption"><small>{{ secao.get_ordem_exibicao }}</small><span>{{ secao.get_titulo }}</span></h3>
        {{ secao.texto|safe }}
    </div>
{% endfor %}
