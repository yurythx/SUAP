<h1>Nova atribuição</h1>
<h2>Erro #{{ erro.pk }}</h2>
<dl>
    <dt>Responsável pela atribuição:</dt>
    <dd>{{ atribuinte }}</dd>
    <dt>Novo atendente:</dt>
    <dd>{{ erro.atendente_atual }}</dd>
</dl>

<h3>Dados gerais</h3>
<dl>
    <dt>Reportado por:</dt>
    <dd>{{ erro.informante }}</dd>
</dl>
<p class="more-info">Para mais informações, acesse: <a href="{{ erro.get_visualizar_erro_url }}">{{ erro.get_visualizar_erro_url }}</a></p>
