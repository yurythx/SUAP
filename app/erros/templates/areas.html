{% extends super_template %}

{% block action-bar %}
    <ul class="action-bar">
        <li><a href="/admin/erros/erro/" class="btn default">{% icone "eye" %} Visualizar todos</a></li>
    </ul>
{% endblock %}

{% block content %}
    <h3>Escolher Área relacionada aos erros:</h3>
    <div class="flex-container boxes links">
        {% for key, area in lista_areas.items %}
            <a href="/erros/modulos/{{ key }}/" class="box-item">
                <span class="fas fa-{{ area.icone }}" aria-hidden="true"></span>
                <h4>{{ area.area }}</h4>
            </a>
        {% endfor %}
    </div>
{% endblock %}
