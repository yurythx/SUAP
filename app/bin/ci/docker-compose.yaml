services:
  postgres:
    restart: unless-stopped
    container_name: postgres
    command: ["postgres", "-c", "max_locks_per_transaction=1024", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    image: postgres:18
    shm_size: 2gb
    networks:
      - suap-network
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
  web:
    restart: unless-stopped
    container_name: web
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - suap-network
    volumes:
      - ./nginx/:/etc/nginx/conf.d/
      - ./nginx.conf:/etc/nginx/nginx.conf
  pdfprinter:
    restart: unless-stopped
    container_name: pdfprinter
    image: gitlab.ifrn.edu.br:4567/cosinf/suap-pdf:latest
    networks:
      - suap-network
    ports:
      - "9000:8000"
  mail:
    restart: unless-stopped
    container_name: mail
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - suap-network
volumes:
  postgres: {}
networks:
  suap-network: {}
