{% if f.abonos_parciais %}
    <button class="btn default mostrarObservacoes m-1" data-anchor="frequencia-{{ f.dia|date:'Y-m-d' }}">
        {% icone "expand-alt" %}&nbsp;Abonos Parciais ({{ f.abonos_parciais|length }})
    </button>
    <ul class="comments flex-container gap-3 d-none">
        {% for abono_parcial in f.abonos_parciais %}
            <li>
                {{ abono_parcial.get_situacao_display_html }}
                <div class="clear"></div>
                <p>{{ abono_parcial|truncatechars:100|linebreaksbr }}</p>
                <div class="clear"></div>
                {% icon "view" "{{ abono_parcial.get_absolute_url }}" "Visualizar" "popup" %}
            </li>
        {% endfor %}
    </ul>
{% endif %}
