{% if f.compensacao.is_debito %}
    <div class="progress debito">
        <p>{{ f.compensacao.ch_paga_percentual }}%</p>
    </div>
    {% if f.compensacao.ch_restante_a_pagar_is_maior_que_zero %}
        <p class="progress-description" title="Carga horária pendente{% if f.compensacao.ch_restante_a_pagar_is_menor_que_15min %} (menor ou igual a 15min){% endif %}">
            Faltam {{ f.compensacao.ch_restante_a_pagar }}
        </p>
    {% endif %}
{% else %}
    <span class="obs">Sem débitos.</span>
{% endif %}
