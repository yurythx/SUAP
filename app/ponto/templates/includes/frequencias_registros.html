{% if f.horarios %}
    {% for h in f.horarios %}
        <p class="text-nowrap hint hint-top" aria-label="{% if h.acao == 'E' %}Entrada{% else %}Saída{% endif %} no Terminal: {{ h.maquina }}{% if h.ip %}: {{ h.ip }}{% endif %}">
            <strong>{{ h.acao }}</strong>:&nbsp;<span class="{% if h.acao == 'E' %}true{% else %}false{% endif %}">{{ h.horario|date:"H:i:s" }}</span>
        </p>
    {% endfor %}
{% else %}
    <span class="obs">Sem registros.</span>
{% endif %}
