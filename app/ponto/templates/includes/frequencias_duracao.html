<dt>Duração:</dt>
{% if f.duracao_computada %}
    <dd><span class="line-through">{{ f.duracao_bruto }}</span> {{ f.duracao_computada }}</dd>
{% elif f.duracao_bruto > f.duracao %}
    <dd><span class="line-through">{{ f.duracao_bruto }}</span> {{ f.duracao }}</dd>
{% else %}
    <dd>{{ f.duracao_bruto }}</dd>
{% endif %}
