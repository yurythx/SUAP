<style>
.steps-migracao a {
    color: inherit;
    text-decoration: none;
    display: block;
}
.steps-migracao a:hover span:not(.active) {
    filter: brightness(0.96);
}
</style>

<div class="mb-4">
    <ul class="steps steps-migracao">
        <li aria-label="Passo 1: Matrizes" class="hint hint-bottom">
            <a href="{% url 'importar_matriz_csv' %}">
                <span class="step-info{% if passo_atual == 1 %} active{% endif %}">1. Matrizes</span>
            </a>
        </li>
        <li aria-label="Passo 2: Componentes" class="hint hint-bottom">
            <a href="{% url 'importar_componente_csv' %}">
                <span class="step-info{% if passo_atual == 2 %} active{% endif %}">2. Componentes</span>
            </a>
        </li>
        <li aria-label="Passo 3: Cursos" class="hint hint-bottom">
            <a href="{% url 'importar_curso_csv' %}">
                <span class="step-info{% if passo_atual == 3 %} active{% endif %}">3. Cursos</span>
            </a>
        </li>
        <li aria-label="Passo 4: Alunos" class="hint hint-bottom">
            <a href="{% url 'importar_aluno_csv_v2' %}">
                <span class="step-info{% if passo_atual == 4 %} active{% endif %}">4. Alunos</span>
            </a>
        </li>
        <li aria-label="Passo 5: Históricos" class="hint hint-bottom">
            <a href="{% url 'importar_historico_aluno_csv' %}">
                <span class="step-info{% if passo_atual == 5 %} active{% endif %}">5. Históricos</span>
            </a>
        </li>
        <li aria-label="Passo 6: Procedimentos" class="hint hint-bottom">
            <a href="{% url 'importar_procedimento_matricula_csv' %}">
                <span class="step-info{% if passo_atual == 6 %} active{% endif %}">6. Procedimentos</span>
            </a>
        </li>
        <li aria-label="Passo 7: Equivalências" class="hint hint-bottom">
            <a href="{% url 'importar_equivalencia_csv' %}">
                <span class="step-info{% if passo_atual == 7 %} active{% endif %}">7. Equivalências</span>
            </a>
        </li>
        <li aria-label="Passo 8: Inicializar período" class="hint hint-bottom">
            <a href="{% url 'inicializar_periodo_letivo' %}">
                <span class="step-info{% if passo_atual == 8 %} active{% endif %}">8. Inicializar período</span>
            </a>
        </li>
    </ul>
</div>
