<div class="table-responsive">
<table>
    <caption>Selecione os diários que também serão atualizados com a nova data</caption>
    <thead>
    <tr>
        <th class="text-center">
            <input type="checkbox" onchange="var is = this.parentNode.parentNode.parentNode.parentNode.parentNode.getElementsByTagName('input');for(var i=0; i<is.length; i++) is[i].checked = this.checked"/>
        </th>
        <th class="text-center">Diário</th>
        <th class="text-center">Data da matrícula</th>
    </tr>
    </thead>
    <tbody>
    {% for obj in objects %}
        <tr>
            <td class="text-center">{{ obj.widget }}</td>
            <td class="text-center">{{ obj.diario.get_descricao_resumida }}</td>
            <td class="text-center">{{ obj.data_matricula|format }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
</div>
