<div class="tab-pane ajax-rendered" data-title="Em acompanhamento" data-tab="em_acompanhamento" data-counter="{{ em_acompanhamento|length }}">
    {% if em_acompanhamento %}
        <div class="table-responsive">
            <table>
                <caption>Alunos em acompanhamento</caption>
                <thead>
                    <tr>
                        <th class="no-print">Ações</th>
                        <th>Aluno</th>
                        <th>Campus</th>
                        <th>NEEs</th>
                        <th>Data do acolhimento</th>
                    </tr>
                </thead>
                <tbody>
                    {% for acolhimento in em_acompanhamento %}
                        <tr>
                            {% include "napne/includes/tr_aluno.html" %}
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <p class="alert alert-warning">Nenhum acolhimento em acompanhamento.</p>
    {% endif %}    
</div>
