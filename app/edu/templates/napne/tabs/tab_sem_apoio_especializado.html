<div class="tab-pane ajax-rendered" data-title="Sem apoio especializado" data-tab="tab_sem_apoio_especializado" data-counter="{{ sem_apoio_especializado|length }}">
    {% if sem_apoio_especializado %}
        <div class="table-responsive">
            <table>
                <caption>Alunos acolhidos sem apoio especializado</caption>
                <thead>
                    <tr>
                        <th class="no-print">Ações</th>
                        <th>Aluno</th>
                        <th>Campus</th>
                        <th>NEEs</th>
                        <th>Data do acolhimento</th>
                    </tr>
                </thead>
                <tbody>
                    {% for acolhimento in sem_apoio_especializado %}
                        <tr>
                            {% include "napne/includes/tr_aluno.html" %}
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <p class="alert alert-warning">Nenhum acolhimento sem apoio especializado.</p>
    {% endif %}
</div>
