<div class="tab-pane ajax-rendered" data-title="Sem entrevista" data-tab="sem_entrevista" data-counter="{{ sem_entrevista|length }}">
    {% if sem_entrevista %}
        <div class="table-responsive">
            <table>
                <caption>Alunos sem entrevista</caption>
                <thead>
                    <tr>
                        <th class="no-print">Ações</th>
                        <th>Aluno</th>
                        <th>Campus</th>
                        <th>NEEs</th>
                        <th>Data do acolhimento</th>
                    </tr>
                </thead>
                <tbody>
                    {% for acolhimento in sem_entrevista %}
                        <tr>
                            {% include "napne/includes/tr_aluno.html" %}
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <p class="alert alert-warning">Nenhum acolhimento sem entrevista.</p>
    {% endif %}
</div>
