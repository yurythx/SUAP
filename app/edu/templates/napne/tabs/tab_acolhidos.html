<div class="tab-pane ajax-rendered" data-title="Acolhidos" data-tab="acolhidos" data-counter="{{ acolhidos.count }}">
    {% if acolhidos %}
        <div class="table-responsive">
            <table>
                <caption>Alunos acolhidos</caption>
                <thead>
                    <tr>
                        <th class="no-print">Ações</th>
                        <th>Aluno</th>
                        <th>Campus</th>
                        <th>NEEs</th>
                        <th>Data do acolhimento</th>
                    </tr>
                </thead>
                <tbody>
                    {% for acolhimento in acolhidos %}
                        <tr>
                            {% include "napne/includes/tr_aluno.html" %}
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <p class="alert alert-warning">Nenhum aluno acolhido.</p>
    {% endif %}
</div>
