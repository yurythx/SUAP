
<td class="field-show_list_display_icons">
    <a class="icon icon-view" href="{% url 'napne_visualizar_acolhimento' acolhimento.id %}" title="Ver acolhimento"><span class="visually-hidden">Ver acolhimento</span></a>
</td>
<td>
    <h3 class="pt-0">{{ acolhimento.aluno }}</h3>
    <dl>
        {% for label, value in acolhimento.get_detalhes_aluno %}
            <div class="list-item">
                <dt>{{ label }}</dt>
                <dd>{{ value }}</dd>
            </div>
        {% endfor %}
    </dl>
</td>
<td>{{ acolhimento.aluno.campus }}</td>
<td>{{ acolhimento.get_nees_aluno|safe }}</td>
<td>{{ acolhimento.data_acolhimento }}</td>
