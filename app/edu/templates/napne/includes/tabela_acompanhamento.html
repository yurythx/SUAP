<div class="extra-info">
    <div class="table-responsive">
        <table>
            <caption>Acompanhamentos</caption>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Cadastrado por</th>
                    <th>Descrição</th>
                </tr>
            </thead>
            <tbody>
                {% for acompanhamento in acompanhamentos %}
                    <tr>
                        <td>{{ acompanhamento.cadastrado_em|format }}</td>
                        <td>{{ acompanhamento.cadastrado_por|format }}</td>
                        <td>{{ acompanhamento.descricao }}</td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="3">Nenhum acompanhamento registrado.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
