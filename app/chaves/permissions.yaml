Avaliador de Sala:
  app_manager: comum
  chaves:
    chave:
    - view_chave
    - change_chave
Coordenador de Chaves:
  description: Responsável pelo gerenciamento (cadastro, edição e listagem) das chaves, salas e prédios na unidade onde encontra-se lotado. Apesar de ser uma atribuição específica do grupo Operador de Chaves, o Coordenador de Chaves também pode registrar as movimentações das chaves (empréstimos) no sistema.
  chaves:
    chave:
    - add_chave
    - view_chave
    - change_chave
    - poder_ver_do_campus
    movimentacao:
    - add_movimentacao
    - view_movimentacao
    - change_movimentacao
  comum:
    predio:
    - add_predio
    - view_predio
    - change_predio
    sala:
    - add_sala
    - view_sala
    - change_sala
  rh:
    servidor:
    - view_servidor
Coordenador de Chaves Sistêmico:
  description: Responsável pelo gerenciamento (cadastro, edição e listagem) das chaves, salas e prédios na reitoria e eventualmente em qualquer outra unidade quando necessário. Apesar de ser uma atribuição específica do grupo Operador de Chaves, o Coordenador de Chaves Sistêmico também pode registrar as movimentações das chaves (empréstimos) no sistema.
  chaves:
    chave:
    - add_chave
    - view_chave
    - change_chave
    - poder_ver_todas
    movimentacao:
    - add_movimentacao
    - view_movimentacao
    - change_movimentacao
  comum:
    predio:
    - add_predio
    - view_predio
    - change_predio
    sala:
    - add_sala
    - view_sala
    - change_sala
  rh:
    servidor:
    - view_servidor
Operador de Chaves:
  description: Responsável basicamente pelo registro das movimentações das chaves (empréstimos) no sistema. Apesar de ser uma atribuição específica do Coordenador de Chaves, o Operador de Chaves pode eventualmente cadastrar uma chave no sistema.
  chaves:
    chave:
    - add_chave
    - view_chave
    - change_chave
    - poder_ver_do_campus
    movimentacao:
    - add_movimentacao
    - view_movimentacao
    - change_movimentacao
  rh:
    servidor:
    - view_servidor
