        documentavel: true
        descricao: No cadastro do Programa é possível definir o nome, o tipo, a qual campus o programa está vinculado e quais
          os tipos de atendimentos vinculados ao Programa. Também é possível informar se os alunos poderão solicitar o benefício
          diretamente pelo SUAP, como, por exemplo, requerer o agendamento de refeição, além de informar o público-alvo, que
          pode incluir alunos de outros campi. Ação executada pelo Coordenador de Atividades Estudantis Sistêmico.
        telas:
