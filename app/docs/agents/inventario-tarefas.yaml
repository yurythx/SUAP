      - nome: Ofertas de Alimentação
        documentavel: true
        descricao: O cadastro de Ofertas de Alimentação está ligado exclusivamente aos programas do tipo 'Alimentação Estudantil'
          e serve para o controle diário de refeições. O cadastro é feito semanalmente. De acordo com a oferta diária para
          cada refeição, os gestores controlam a demanda, levando em conta a quantidade de participantes do programa de alimentação,
          dos agendamentos cadastrados e dos registros avulsos. Ação executada pelo Assistente Social ou pelo Coordenador
          de Atividades Estudantis.
        telas:
        - Atividades Estudantis::Serviço Social::Programas::Ofertas::Refeições
      - nome: Turmas de Idioma
        documentavel: true
        descricao: O cadastro de Turmas de Idioma está ligado exclusivamente aos programas do tipo 'Curso de Idiomas' e possui
          as opções de turmas que poderão ser indicadas pelos alunos que se inscrevem no programa. Ação executada pelo Assistente
          Social ou pelo Coordenador de Atividades Estudantis.
        telas:
        - Atividades Estudantis::Serviço Social::Programas::Ofertas::Turmas de Idiomas
      - nome: Período de Inscrição
        documentavel: true
        descricao: Para cada edital cadastrado, um ou mais períodos de inscrição podem ser criados. Um período de inscrição
          é vinculado à um campus e define quais programas estarão com inscrições abertas. Após o cadastro de um período de
          inscrição, os alunos pertencentes aos campi público-alvo dos programas informados poderão se inscrever nos mesmos
          através de um alerta exibido na tela inicial do SUAP. Ação executada pelo Assistente Social ou pelo Coordenador
          de Atividades Estudantis.
        telas:
        - Atividades Estudantis::Serviço Social::Programas::Períodos de Inscrição
