    - nome: Submissão de Projeto de Pesquisa
      arquivo: pesquisa/features/002.PESQUISA.cadastro.projeto.feature
      descricao: ''
      cenarios:
      - nome: Cadastro do Projeto
        documentavel: true
        descricao: Formulário de submissão com as informações básicas do projeto. Após o envio dos dados, o projeto estará
          cadastrado mas ainda não terá sido submetido, ou seja, a situação do projeto será 'em edição' (rascunho). Só após
          o cadastro das demais informações obrigatórias, descritas nos próximos passos, é que o projeto poderá ser efetivamente
          submetido. Ação executada pelo Servidor (coordenador do projeto).
        telas:
        - Pesquisa::Projetos::Submeter Projetos
      - nome: Sai do sistema
        documentavel: false
        descricao: ''
        telas:
        - Sair
      - nome: Inclusão de Servidor na Equipe
        documentavel: true
        descricao: Cadastro do servidor membro do projeto de pesquisa. Ação executada pelo Servidor (coordenador do projeto).
        telas:
        - Pesquisa::Projetos::Meus Projetos
      - nome: Sai do sistema
        documentavel: false
        descricao: ''
        telas:
        - Sair
      - nome: Inclusão de Aluno na Equipe
        documentavel: true
        descricao: Cadastro do aluno membro do projeto de pesquisa. Ação executada pelo Servidor (coordenador do projeto).
        telas:
        - Pesquisa::Projetos::Meus Projetos
      - nome: Sai do sistema
        documentavel: false
        descricao: ''
        telas:
        - Sair
      - nome: Cadastro das Metas
        documentavel: true
        descricao: Cadastro das metas do projeto. Ação executada pelo Servidor (coordenador do projeto).
        telas:
        - Pesquisa::Projetos::Meus Projetos
      - nome: Sai do sistema
        documentavel: false
        descricao: ''
        telas:
        - Sair
      - nome: Cadastro das Atividades
        documentavel: true
        descricao: Cadastro das atividades que serão realizadas dentro de cada meta do projeto. Ação executada pelo Servidor
          (coordenador do projeto).
        telas:
        - Pesquisa::Projetos::Meus Projetos
      - nome: Sai do sistema
        documentavel: false
        descricao: ''
        telas:
        - Sair
      - nome: Cadastro das Memórias de Cálculo
        documentavel: true
        descricao: A memória de cálculo serve para descrever em detalhes os gastos que serão realizados no projeto. Nesta
          aba do projeto existe o Demonstrativo do Plano de Aplicação/Memória de Cálculo e Desembolso, onde, na coluna 'Valor
          Reservado' consta o valor total disponível para o projeto na rubrica em específico, conforme cadastrado na fonte
          de recurso do edital. Na seção 'Planejado', a coluna 'Valor Planejado' exibe a soma de todas as memórias de cálculo
          cadastradas pelo coordenador do projeto. Já na coluna 'Valor Distribuído' consta a soma de todos os desembolsos
          que foram cadastrados pelo coordenador e na coluna 'Valor Disponível' consta a diferença entre a soma das memórias
          de cálculo e a soma dos desembolsos. Na seção 'Execução', a coluna 'Valor Executado' é a soma de todos os registros
          de gastos cadastrados pelo coordenador do projeto e a coluna 'Valor Disponível' é a diferença entre o total de desembolsos
          e o total de gastos. Ação executada pelo Servidor (coordenador do projeto).
        telas:
        - Pesquisa::Projetos::Meus Projetos
      - nome: Sai do sistema
        documentavel: false
        descricao: ''
        telas:
        - Sair
      - nome: Cadastro dos Desembolsos
        documentavel: true
        descricao: Com base na memória de cálculo, neste passo o coordenador do projeto informa quando pretende realizar os
          gastos(desembolsos) dos recursos. Por exemplo, uma memória de cálculo no valor de R$ 10.000,00 prevista para pagamento
          de alunos bolsistas pode ter 10 desembolsos, no valor de R$1.000,00 cada, que serão executados ao longo de 10 meses.
          Ação executada pelo Servidor (coordenador do projeto).
        telas:
        - Pesquisa::Projetos::Meus Projetos
      - nome: Sai do sistema
        documentavel: false
        descricao: ''
        telas:
        - Sair
      - nome: Submissão do Projeto
        documentavel: true
        descricao: Após o cadastro de todas as informações obrigatórias, o coordenador do projeto está apto a realizar a submissão
          do projeto. Ação executada pelo Servidor (coordenador do projeto).
        telas:
        - Pesquisa::Projetos::Meus Projetos
      - nome: Sai do sistema
        documentavel: false
        descricao: ''
        telas:
        - Sair
