{% extends super_template %}

{% block content %}

    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th>Avaliador</th>
                <th>Modalidade</th>
            </tr>
            </thead>
            <tbody>
            {% for item in avaliadores_modalidade %}
                <tr>
                    <td>{{ item.avaliador }}</td>
                    <td>{{ item.modalidade.tipo }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2">Todos os avaliadores estão vinculados a algum trabalho.</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

{% endblock %}
