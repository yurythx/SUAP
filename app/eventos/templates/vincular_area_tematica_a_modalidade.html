{% extends super_template %}

{% block extrahead %}
    {{ block.super }}
    <script>
        $(document).ready(function() {
        });
    </script>
{% endblock %}

{% block content %}
    <form method="post" id="frm_vincular_area_tematica">
        {% csrf_token %}
        <div class="table-responsive">
            <table>
                <caption>Vincular áreas temáticas à modalidade "{{ modalidade }}"</caption>
                <thead>
                    <tr>
                        <th>Vincular</th>
                        <th>Área temática</th>
                        <th>Limite de aprovados</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in areas_tematicas %}
                        <tr>
                            <td>
                                <input value="{{ item.id }}" name="ids" type="checkbox" {% if item.id in itens_vinculados %}checked{% endif %}>
                            </td>
                            <td>{{ item }}</td>
                            <td><input type="number" step="1" name="limite_aprovados_{{ item.id }}" value="{% if item.id in itens_vinculados %}{{ itens_vinculados|get_value_dict:item.id }}{% else %}0{% endif %}" /></td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="submit-row">
            <button type="submit" class="btn success">Salvar alterações</button>
        </div>
    </form>

{% endblock %}
