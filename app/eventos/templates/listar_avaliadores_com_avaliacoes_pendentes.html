{% extends super_template %}

{% block content %}

    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th>Avaliador</th>
                <th>Submissão</th>
            </tr>
            </thead>
            <tbody>
            {% for item in avaliacoes_submissao %}
                <tr>
                    <td>{{ item.avaliador_modalidade.avaliador }}</td>
                    <td>#{{ item.versao.submissao.pk }} - {{ item.versao.submissao }}</td>
                </tr>
            {% empty %}
                <tr><td colspan="2">Nenhum avaliador com avaliações pendentes.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

{% endblock %}
