{% extends "admin/base_anonima.html" %}
{% load i18n eventos_tags %}

{% block bodyclass %}centered{% endblock %}

{% block content %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <fieldset>
            {% for field in form %}
                <div class="form-row{% if field.field.required %} required{% endif %}{% if field.errors %} errors{% endif %} {{ field.label|slugify }}">
                    <div class="field-box-first">
                        {{ field.errors }}
                        {{ field.label_tag }}
                        {{ field }}
                        <p class="help">{{ field.help_text }}</p>
                    </div>
                </div>
            {% endfor %}
        </fieldset>
        <div class="submit-row">
            <input type="submit" class="btn success" value="Atualizar">
            <a href="{% url 'perfil_do_participante' evento.pk %}" class="btn default">Cancelar</a>
        </div>
    </form>

{% endblock %}
