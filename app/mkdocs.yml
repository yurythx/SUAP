# Site de documentação de usuário do SUAP.
#
# A fonte mora em `<modulo>/docs/usuario.md`, junto do código; `bin/scripts/montar_site_doc.py`
# a reúne em `site-src/<area>/<modulo>.md` antes do build. Ver #16998 e #17004.
#
#   python bin/scripts/montar_site_doc.py && uv run mkdocs build
#
# Não há `nav`: a árvore de diretórios de `site-src/` É a navegação, e as áreas vêm de
# `apps.py:area`. Menos um lugar para desatualizar.

site_name: Central de Ajuda do SUAP
site_description: Guias de uso do SUAP — Instituto Federal do Rio Grande do Norte
site_url: https://suap.ifrn.edu.br/
docs_dir: site-src
site_dir: site
use_directory_urls: true

theme:
  name: null
  custom_dir: docs/theme
  include_search_page: false
  search_index_only: false

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details

plugins:
  - search:
      lang: pt

# O site é público: descreve telas, não dados. A regra que sustenta isso está no prompt do
# subagente — a doc é gerada apenas contra o banco semeado, nunca homologação ou produção.
