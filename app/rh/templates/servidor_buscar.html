{% extends super_template %}

{% block content %}

    {% if form.errors %}
        <p class="errornote">Por favor, corrija os erros abaixo.</p>
    {% endif %}

    <form action="" method="GET">
        
        {% render_form form False submit_label=False %}

        <fieldset id="info" class="module aligned mt-4">
            <h2 class="d-flex flex-wrap gap">Opções de visualização <button id="markall-info" class="btn ms-auto" type="button">Marcar todos</button></h2>
            <div class="form-row">
                <div class="field-box">
                    <ul class="checkboxes">
                        {% for campo in campos_servidor|dictsort:"alias" %}
                            <li>
                                <label for="{{ campo.campo }}"><input type="checkbox" name="campos" value="{{ campo.campo }}"
                                    id="{{ campo.campo }}" onchange="atualiza_select();"> {{ campo.alias }}</label>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </fieldset>
        <div class="submit-row">
            <input type="submit" class="default" value="Enviar">
        </div>

    </form>
    <script>
        atualiza_select = function () {
            var campos_nao_agrupaveis = [{% for c in campos_servidor_nao_agrupaveis %}'{{c}}',{% endfor %}];

            var agrupar_valor = $('select[name=agrupador] option:checked').text();
            $("[name=agrupador]").html(function () {
                var options = "";
                options += "<option value=''>------</option>";
                var campos = $(".checkboxes :checked");
                campos.sort();
                var atributo_selected = "";
                campos.each(
                    function (i, campo) {
                        if (campos_nao_agrupaveis.indexOf($(campo).parent().text()) < 0) {

                            if ($(campo).parent().text() == agrupar_valor) {
                                atributo_selected = 'selected="selected"';
                            }
                            else {
                                atributo_selected = "";
                            }
                            options += "<option value='" + $(campo).attr("id") + "' " + atributo_selected + ">" + $(campo).parent().text() + "</option>";
                        }
                    }
                );
                return options;
            });

            var subagrupar_valor = $('select[name=subagrupador] option:checked').text();
            $("[name=subagrupador]").html(function () {
                var options = "";
                options += "<option value=''>------</option>";
                var campos = $(".checkboxes :checked");
                campos.sort();
                var atributo_selected = "";
                campos.each(
                    function (i, campo) {
                        if (campos_nao_agrupaveis.indexOf($(campo).parent().text()) < 0) {
                            if ($(campo).parent().text() == subagrupar_valor) {
                                atributo_selected = 'selected="selected"';
                            }
                            else {
                                atributo_selected = "";
                            }
                            options += "<option value='" + $(campo).attr("id") + "' " + atributo_selected + ">" + $(campo).parent().text() + "</option>";
                        }
                    }
                );
                return options;
            })
        };
        var checked = false;
        $('#markall-info').on('click', function () {
            $(this).parent().next().find(".checkboxes").find("li").find(':checkbox')
                .prop('checked', (checked = !checked));
            $(this).html(checked ? 'Desmarcar todos' : 'Marcar todos');
            atualiza_select();
        });
    </script>
{% endblock %}
