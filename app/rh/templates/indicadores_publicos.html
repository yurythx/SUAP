{% extends "admin/base_anonima.html" %}

{% block extrahead %}
<script src="/static/djtools/graficos/highcharts.js"></script>
<script src="/static/djtools/graficos/exporting.js"></script>
{% endblock %}

{% block content %}

    {% box "Gráficos" %}
        <script>
            {% for graf in graficos %}
                {{ graf|safe }}
            {% endfor %}
        </script>
        <div class="graficos-container">
            {% for graf in graficos %}
                <div class="grafico-item" id="{{ graf.chart.renderTo }}"></div>
            {% endfor %}
        </div>
    {% endbox %}

{% endblock %}
