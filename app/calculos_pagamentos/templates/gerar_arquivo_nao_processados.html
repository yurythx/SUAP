{% extends super_template|default:"admin/base_site.html" %}

{% block content %}
    {% if form and not arquivo.file_path %}
        {% render_form form %}
    {% endif %}
    {% if arquivo.file_path %}
        <div id="download_div">
            <br/><br/><br/><br/>
            <h3>Arquivo:</h3>
            <br/>
            <a href="/calculos_pagamentos/regerar_arquivo/{{ arquivo.id }}/">{{ arquivo.file_path|getfilenamefrompath }}</a>
            <br/><br/><br/><br/>
            <a class="btn" href="{{ pos_url}}">Voltar para pagamento(s)</a>
        </div>
    {% endif %}
{% endblock %}
