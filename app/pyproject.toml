[project.urls]
Homepage = "https://portal.suap.ifrn.edu.br"
Documentation = "https://suap.ifrn.edu.br/comum/documentacao/"
Repository = "https://gitlab.ifrn.edu.br/cosinf/suap.git"
Changelog = "https://gitlab.ifrn.edu.br/cosinf/suap/-/blob/master/CHANGELOG.md"

[tool.ruff]
line-length = 150
indent-width = 4

[tool.ruff.lint]
exclude = ["*/migrations/*"]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-bandit
    "S",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # concat strings
    "ISC",
    # Remove unecessary or repeated
    "PIE",
    # pytest
    "PT",
    # check for debugger on code
    "T10",
    # raise checker
    "RSE",
    # warning
    "W",
    # flynt
    "FLY",
    # furb
    "FURB",
    "RUF",
    # flake8-logging
    "LOG",
    "PYI",
    "PERF",
    "PLC",
    "PLE",
    "PLW",
    "T"
]
# Skip unused variable rules (`F841`).
ignore = [
    "A001", # Variable is shadowing a Python builtin
    "A002", # Argument is shadowing a Python builtin
    "A004", # Import is shadowing a Python builtin
    "B904", # Ignore raises without from
    "ISC001", # Avoiding conflicts with ruff format
    "E501", # Ignore long lines
    "DJ001", # Ignore null Charfields
    "FBT002", # Ignore Positional Boolean Arguments
    "FURB157", # Verbose expression in `Decimal` constructor
    "PERF401", # Use a list comprehension to create a transformed list
    "PT011", # Ignore pytest raises without from
    "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
    "S105", # Possible hardcoded password assigned
    "S106", # Hardcoded password
    "S108", # Use of /tmp
    "S110", # Ignore try-except-pass
    "S112", # Ignore use of try-except-continue
    "S301", # `pickle` and modules that wrap it can be unsafe when used to deserialize untrusted data
    "S308", # Use of mark_safe
    "S311", # Ignore pseudo-random number generator
    "S314", # Using `xml` to parse untrusted data is known to be vulnerable to XML attacks; use `defusedxml` equivalents
    "S318", # Using `xml` to parse untrusted data is known to be vulnerable to XML attacks; use `defusedxml` equivalent
    "S324", # VOTE: Probable use of insecure hash functions in `hashlib`: `sha1`
    "S501", # Probable use of `requests` call with `verify=False` disabling SSL certificate checks
    "S602", # Ignore shell=True in subprocess calls
    "S603", # `subprocess` call: check for execution of untrusted input
    "S605", # Starting a process with a shell, possible injection detected
    "S607", # Starting a process with a partial executable path
    "S608", # Possible SQL injection vector through string-based query construction
    "S610", # Use of Django `extra` can lead to SQL injection vulnerabilities
    "SIM905", # Consider using a list literal instead of `str.split`
    "PLC0415", #  `import` should be at the top-level of a file
    "PLW0642", # Reassigned variable in instance method
    "PLW2901", # `for` loop variable `ro_rows` overwritten by assignment target
    "PLW0603", # Using the global statement to update
    "RUF012", # Mutable class attributes should be annotated with typing.ClassVar
    "RUF021", # Parenthesize ternary expressions when chaining `and` and `or` together
    "SIM102", # sometimes it's better to nest
    "SIM105", # ignore try except pass
    "SIM108", # ignore force ternary operator
    "SIM113", # count in for loop
    "SIM115", # Disable use of a context manager for opening files
    "T201", # VOTE: Ignore prints
]

[tool.ruff.lint.extend-per-file-ignores]
"**/tests/*.py" = ["F811", "F401"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
exclude = ["*/migrations/*"]

[tool.setuptools]
py-modules = []

[tool.djlint]
custom_blocks="box"
ignore="T002,T003,D004,D018,H006,H017,H023,H025,H035"
include="T032"

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main",]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = ".migrations."
ignore_errors = true

[tool.coverage.run]
source = ["."]
# "thread" explícito: o `live_server` dos e2e roda o Django numa thread do processo do
# teste, e é lá que view/form são executados.
concurrency = ["multiprocessing", "thread"]
parallel = true
data_file = "artifacts/.coverage"
omit = [
    # omite qualquer arquivo dentro dos diretórios listados abaixo
    "*/management/*",
    "*/migrations/*",
    "*/site-packages/*",
    "*/dist-packages/*",
    "*/distutils/*",
    "*/.venv/*",
    "*/.venvs/*",
    "*/src/*",
    "*/lib/*",
    "*/django-pagination/*",
    "htmlcov/*",
    ".agents/*",
    # omite qualquer arquivo que contenha a palavra test
    "*/test/*",
    "*tests*",
]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.django-stubs]
django_settings_module = "suap.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "suap.settings"
addopts = "--no-migrations --maxfail=10 --tb=short"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test", "*TestCase"]
markers = [
    "e2e: fluxos de browser (pytest-playwright + live_server do pytest-django)",
    "cenario(arquivo, *nomes): cenários da `.feature` do behave que este teste cobre; gate em bin/scripts/paridade_e2e.py",
    "doc: geração da documentação de usuário (subagente documentador-usuario); reusa as fixtures e2e para navegar e capturar",
    "mock: stubs que materializam os seeds e2e para o manage.py gerar_banco_mock; fora da coleta salvo com -m mock",
]
filterwarnings = [
    "ignore:Using extra keyword arguments on `Field` is deprecated:DeprecationWarning",
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated:DeprecationWarning",
]
