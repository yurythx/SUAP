{% if calendario %}
    <div class="legenda">
        <p>Legenda:</p>
        <ul>
            <li class="hoje">Hoje</li>
            <li class="warning">Solicitação de reserva</li>
            <li class="success">Reservas deferidas</li>
            <li class="danger">Reservas indisponíveis</li>
            <li class="conflito">Conflito</li>
            <li class="extra5">Aulas</li>
        </ul>
    </div>
{% else %}
    <p class="alert alert-warning">Nenhum agendamento encontrado.</p>
{% endif %}
{% for mes in calendario %}
    {{ mes|safe }}
{% endfor %}
