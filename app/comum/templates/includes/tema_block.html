<div title="Alterar tema para {{ tema.nome }}" class="box-item {% if preferencia.tema == tema.slug or not preferencia and tema.slug == 'padrao' %}success{% endif %}">
    <h3 class="title">{{ tema.nome }}</h3>
    <div class="theme-content">
        <p class="fs-4">{{ tema.descricao }}</p>
        <p class="mt-auto pt-4"><small class="d-block">{{ tema.qtd }} usuário{{ tema.qtd|pluralize }} usa{{ tema.qtd|pluralize:"m" }} este tema.</small></p>
        <p class="mt-3">
            <a href="/comum/alterar_tema?theme={{ tema.slug }}" class="btn success">
                {% if preferencia.tema == tema.slug or not preferencia and tema.slug == 'padrao' %}
                    {% icone "check" %} Selecionado
                {% else %}
                    Selecionar
                {% endif %}
            </a>
        </p>
    </div>
    <a href="/comum/alterar_tema?theme={{ tema.slug }}"><img src="/static/comum/img/temas/{{ tema.slug }}/thumbnail.svg" alt="Imagem da página inicial do tema {{ tema.nome }}"></a>
</div>
