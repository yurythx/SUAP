{% block extrahead %}
    <style>
        form .chamado_select_input_container {
            grid-area: input;
        }
    </style>
{% endblock %}

<div class="chamado_select_input_container">
    {% for choice in choices %}
        {% include "includes/box_min_chamado.html" with chamado=choice.0 modo_selecionar=True modo_selecionar_checkbox_name=widget.name selecionado=choice.1 %}
    {% empty %}
        <p class="alert alert-warning">Nenhuma opção de chamado a exibir.</p>
    {% endfor %}
</div>
