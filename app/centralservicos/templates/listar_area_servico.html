{% extends super_template %}
{% load centralservicos_templatetags %}

{% block content %}

    <form name="buscarservico_form" id="buscarservico_form" method="post" class="featured-form">
        {% csrf_token %}
        {% render_form form render_full=False submit_label=False %}
    </form>

    {% box title_box %}
        <div class="boxes links flex-container">
            {% for area in lista_areas %}
                <a href="{{ link_prefix }}{{ area.slug }}/" class="box-item">
                    <span class="fas fa-{{ area.icone }}" aria-hidden="true"></span>
                    <h4>{{ area.nome }}</h4>
                </a>
            {% endfor %}
        </div>
    {% endbox %}

{% endblock %}
