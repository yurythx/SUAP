<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Suap: Em manutenção">
<meta name="keywords" content="suap, administração, pública, mec, ifrn">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Suap: Em manutenção</title>
<link rel="shortcut icon" href="https://suap.ifrn.edu.br/static/comum/img/favicon-maintenance.png" />
<style>
:root {
    --grey-200:  #eee;
    --grey-500:  #666;
    --warning:   #CAC302;
}
* {
    border: 0 none;
    margin: 0;
    outline: 0 none;
    padding: 0;
}
*,
*:after,
*:before {
    -webkit-box-sizing: border-box;
    -moz-box-sizing: border-box;
    box-sizing: border-box;
}
html {
    height: 100%;
}
body {
    font-family: sans-serif;
    font-size: 100%;
    height: 100%;
}
main {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5rem;
    justify-content: center;
    height: 100%;
    padding: 10rem;
}
main img {
    max-width: 400px;
}
section {
    flex-basis: 50%;
}
h1 {
    color: var(--warning);
    font-size: 3rem;
    font-weight: 900;
    line-height: 1em;
    padding-bottom: 1rem;
}
p {
    font-size: 1.5rem;
    font-weight: 300;
    line-height: 1.5em;
}
.obs {
    color: var(--grey-500);
    font-size: .9rem;
    font-weight: 300;
    padding-top: 2rem;
    + .obs {
        padding-top: .5rem;
    }
}
ul {
    padding-left: 1rem;
}
@media screen and (min-width: 2156px) {
    section {
        flex-basis: 30%;
    }
}
@media screen and (max-width: 1000px) {
    main {
        padding-left: 2rem;
        padding-right: 2rem;
    }
}
@media screen and (max-width: 900px) {
    main {
        padding-top: 5rem;
        padding-bottom: 5rem;
    }
    section {
        flex-basis: 100%;
    }
}
@media screen and (max-width: 940px), only screen and (min-device-width: 320px) and (max-device-width: 736px) and (-webkit-min-device-pixel-ratio: 2), only screen and (min-device-width: 768px) and (max-device-width: 1024px) and (-webkit-min-device-pixel-ratio: 1), only screen and (min-device-width: 768px) and (max-device-width: 1024px) and (-webkit-min-device-pixel-ratio: 2) {
    main {
        min-height: calc(100vh - 120px);
        padding-bottom: 2rem;
    }
    main section {
        display: flex;
        flex-direction: column;
    }
    h1 {
        font-size: 2.5rem;
    }
    .obs {
        margin-top: auto;
    }
}
</style>
</head>

<body>
    <main>
        <section>
            <h1>Suap em manutenção</h1>
            <p>Por favor, aguarde: o Suap está sendo atualizado.</p>
            <p class="obs">Esta mensagem ocorre apenas em algumas páginas?</p>
            <p class="obs">Tente resolver forçando a atualização da página pressionando as teclas:</p>
            <ul class="obs">
                <li>CTRL + F5 ou CTRL + R (no Windows ou Linux)</li>
                <li>CMD + R (no Mac).</li>
            </ul>
        </section>
        <img src="https://suap.ifrn.edu.br/static/comum/img/500-em-manutencao.svg" alt="Suap em manutenção">
    </main>
</body>
</html>
