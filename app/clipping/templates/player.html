<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Player de mídia para vídeos e áudios" />
		<meta name="keywords" content="player, mídia, vídeo, áudio" />
		<title>Player de Mídia</title>
	</head>
	<body>
		{% if eh_video %}
		<video src="{{ publicacao.arquivo.url }}" controls>
			<p>
				Seu navegador não suporta vídeo em HTML. Aqui está um
				<a href="{{ publicacao.arquivo.url }}">link para o vídeo</a>
			</p>
		</video>
		{% endif %}
		
		{% if eh_audio %}
		<audio src="{{ publicacao.arquivo.url }}" controls>
			<p>
				Seu navegador não suporta vídeo em HTML. Aqui está um
				<a href="{{ publicacao.arquivo.url }}">link para o vídeo</a>
			</p>
		</audio>
		{% endif %}
	</body>
</html>
