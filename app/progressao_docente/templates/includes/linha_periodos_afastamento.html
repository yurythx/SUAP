<tr>
    <td>{{ linha.afastamento }}</td>
    <td>
        <ul>
            {% for periodo in linha.periodos %}
                <li>{{ periodo.texto }} <small>({{ periodo.dias }} dia{{ periodo.dias|pluralize }})</small></li>
            {% endfor %}
        </ul>
    </td>
    <td class="text-end">{{ linha.dias }}</td>
</tr>
