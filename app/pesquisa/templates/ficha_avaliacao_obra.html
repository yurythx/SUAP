{% extends super_template %}

{% block content %}
    {% if itens_avaliacao %}
        <table>
            <thead>
                <tr>
                    <th>Critério</th>
                    <th>Pontuação</th>
                    <th>Justificativa</th>
                </tr>
            </thead>
            <tbody>
                {% for item in itens_avaliacao %}
                    <tr>
                        <td>{{ item.pergunta.descricao }}</td>
                        <td>{{ item.nota }}</td>
                        <td>{{ item.comentarios|format }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p class="alert alert-warning">Nenhuma avaliação disponível.</p>
    {% endif %}
{% endblock %}
