{% extends super_template %}

{% block content %}

    
    {% if projetos_avaliados %}
        <table>
            <thead>
                <tr>
                    <th>Edital</th>
                    <th>Declaração</th>
                    <th>Projetos Avaliados</th>
                </tr>
            </thead>
            <tbody>
                {% for projeto in projetos_avaliados %}
                    <tr>
                        <td>{{ projeto.projeto__edital__titulo }}</td>
                        <td><a href="/pesquisa/emitir_declaracao_avaliador_pdf/{{ projeto.projeto__edital }}/" class="btn">Declaração</a></td>
                        <td><a href="/pesquisa/visualizar_projetos_avaliador/{{ projeto.projeto__edital }}/" class="btn">Visualizar</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p class="alert alert-warning">Nenhuma declaração disponível.</p>    
    {% endif %}

{% endblock %}
