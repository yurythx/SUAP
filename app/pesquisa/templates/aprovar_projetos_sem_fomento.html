{% extends super_template %}

{% block content %}
    <form method="POST" id="bolsas_form" action="/pesquisa/autorizar_projetos_sem_fomento/{{ edital.id }}/">
        {% csrf_token %}
        <div class="actions">
            <label>Ação:
                <select name="action">
                    <option selected="selected">Aprovar</option>
                </select>
            </label>
            <button value="0" name="index" title="Executar ação selecionada" class="button" type="submit">Aplicar</button>
        </div>
        <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th class="no-print">Seleção <input type="checkbox" onchange="var is = this.parentNode.parentNode.parentNode.parentNode.getElementsByTagName('input');for(var i=0; i<is.length; i++){ is[i].checked = this.checked;}" /></th>
                    <th>Campus</th>
                    <th>Projeto</th>
                    <th>Coordenador</th>
                    <th>Pontuação</th>
                    <th class="no=print">Opções</th>

                </tr>
            </thead>
            <tbody>
                {% for item in projetos %}
                    <tr>
                        <td class="no-print"><INPUT TYPE="checkbox" NAME="registros" value="{{ item.id }}" /></td>
                        <td>{{ item.uo }}</td>
                        <td>{{ item.titulo }}</td>
                        <td>{{ item.vinculo_coordenador.user|format }}</td>
                        <td>{{ item.pontuacao }}</td>
                        <td class="no-print">
                            <ul class="action-bar">
                                <li><a href="/pesquisa/projeto/{{ item.id }}/" class="btn default">Visualizar</a></li>
                            </ul>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        </div>
    </form>

{% endblock %}
