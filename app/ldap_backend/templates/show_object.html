{% extends super_template %}
{% load ldap_tags %}
{% block action-bar %}
<ul class="action-bar">
    {% ldap_actions vinculo.relacionamento %}
</ul>
{% endblock %}

{% block content %}

{% box obj|get_ldap_attr:"dn" %}
    <dl class="definition-list">
        {% for k in keys %}
            <dt>{{ k }}</dt>
            <dd>{{ obj|get_ldap_attr:k }}</dd>
        {% endfor %}
    </dl>
{% endbox %}

{% endblock %}
