# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  # default language version for each language
  python: python3.14
fail_fast: true
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: end-of-file-fixer
  - id: check-json
  - id: check-merge-conflict
  - id: check-yaml
  - id: check-added-large-files
    args: ["--maxkb=5000", "--enforce-all"]
  - id: pretty-format-json
    args: [--autofix, --no-ensure-ascii]
  - id: mixed-line-ending
    args: ['--fix=lf']
- repo: https://github.com/djlint/djLint
  rev: v1.36.4
  hooks:
    - id: djlint-django
- repo: local
  hooks:
    - id: prints
      name: Check project for prints in views, forms, models and tasks
      entry: python bin/scripts/print-statements.py
      types:
        - python
      # Scripts de linha de comando imprimem por design.
      exclude: ^bin/
      pass_filenames: true
      language: system
    - id: ruff-format
      name: Ruff code formatter
      language: system
      entry: ruff format .
      types:
        - python
      pass_filenames: false
    - id: ruff-check
      name: Ruff code checker
      language: system
      entry: ruff check . --fix --unsafe-fixes
      types:
        - python
      pass_filenames: false
    - id: complexidade-nova
      name: Barra complexidade ciclomática > 10 nova ou aumentada (legado sem piora passa)
      language: system
      entry: uv run --quiet python bin/scripts/complexidade-nova.py
      types:
        - python
      exclude: /migrations/
      pass_filenames: true
