{% extends super_template %}

{% block content %}


    {% if projetos_avaliados %}
        <table>
            <tr>
                <td>Edital</td>
                <td>Declaração</td>
            </tr>

        {% for projeto in dados %}
            <tr>
                <td>{{ projeto.1 }}</td>
                <td><a href="/projetos_ensino/emitir_declaracao_avaliador_pdf/{{ projeto.3 }}/{{ projeto.0 }}/{{ projeto.2 }}/" class="btn">Declaração</a></td>
            </tr>
        {% endfor %}
        </table>
    {% else %}
        <p class="alert alert-warning">Nenhuma declaração disponível.</p>
    {% endif %}

{% endblock %}
