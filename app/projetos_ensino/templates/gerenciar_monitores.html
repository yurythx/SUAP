{% extends super_template %}

{% block content %}


<div class="search-and-filters">
	{% render_form form %}
</div>
	{% if editais.exists %}
		<table>
			<thead>
				<tr>
					<th>Edital</th>
					<th>Descrição</th>
				</tr>
			</thead>
			<tbody>
				{% for edital in editais %}
					<tr>
						<td><a href="/projetos_ensino/selecionar_monitor/{{ edital.id }}/">{{ edital.titulo }}</a></td>
						<td>{{ edital.descricao }}</td>
					</tr>
				{% endfor %}
			</tbody>
		</table>
	{% else %}
		<p class="alert alert-warning">Nenhum edital disponível no momento.</p>
	{% endif %}

{% endblock %}
