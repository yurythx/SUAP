{% extends super_template %}

{% block content %}

<div class="search-and-filters">
    {% render_form form %}
</div>

{% if data %}
    {% if ano == 0 and mes != 0 %}
        <p class="alert alert-danger">Para filtrar por mês, selecione um ano.</p>
    {% endif %}
{% else %}
    {% if request.GET %}
        <p class="alert alert-warning">Não existem documentos para os filtros selecionados.</p>
    {% endif %}
{% endif %}

{% endblock %}
