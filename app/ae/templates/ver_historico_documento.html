{% extends super_template %}

    {% block content %}
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Cadastro</th>
                        <th>Arquivo</th>
                    </tr>
                </thead>
                <tbody>
                    {% for registro in registros %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ registro.cadastrado_por.user|format }} em {{ registro.cadastrado_em|format }}</td>
                        <td>
                            <a class="btn" href="{{ registro.arquivo.url }}"><span class="fas fa-download" aria-hidden="true"></span> Baixar Arquivo</a>
                        </td>


                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% endblock %}
