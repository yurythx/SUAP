{% extends super_template %}



{% block extrahead %}
<script src="/static/djtools/graficos/highcharts.js"></script>
<script src="/static/djtools/graficos/exporting.js"></script>
{% endblock %}

{% block content %}

    <div class="search-and-filters">
        {% render_form form %}
    </div>

    {% if form.is_bound %}
        <div class="graficos-container">
            {% for grafico in grafico_atendimentos %}
                <script>{{ grafico|safe }}</script>
                <div class="grafico-item" id="{{ grafico.id }}"></div>
            {% endfor %}
        </div>
    {% else %}
        <p class="alert alert-warning">Utilize o filtro para exibir os gráficos.</p>
    {% endif %}

{% endblock %}
