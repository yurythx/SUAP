{% extends "djtools/templates/adminutils/change_form.html" %}

{% block content %}
	{{ block.super }}

    {% box 'Agenda Atual' %}
        <div class="legenda">
            <p>Legenda:</p>
            <ul>
                <li class="hoje">Hoje</li>
                <li class="warning">Solicitações de agendamento</li>
                <li class="success">Agendamentos deferidos</li>
            </ul>
        </div>
        {% for mes in calendario %}
            {{ mes|safe }}
        {% endfor %}
    {% endbox %}
{% endblock %}
