{% extends super_template %}
{% load tags %}

{% block content %}

    <p class="alert alert-warning">
        Confirme a alteração de situação da tarefa abaixo.
    </p>

    <dl class="definition-list">
        <dt>Tarefa</dt>
        <dd>{{ tarefa }}</dd>
        <dt>Situação atual</dt>
        <dd>{{ situacao_atual_label }}</dd>
        <dt>Nova situação</dt>
        <dd><strong>{{ nova_situacao_label }}</strong></dd>
    </dl>

    {% render_form form %}

{% endblock %}
