{% extends super_template %}

{% block content_title %}
    <div class="title-container">
        <h2>{{ escala.nome }}</h2>
    </div>
{% endblock %}

{% block content %}
    <ul>
        {% for nivel in escala.niveis_escala.all %}
            <li> {{ nivel.nivel }} - {{nivel}}</li>

        {% endfor %}
    </ul>

    <div class="submit-row">
        <a class="btn default" href="javascript:history.back()" >Voltar</a>
    </div>
{% endblock %}
