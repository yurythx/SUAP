{% extends super_template %}

{% block content %}
    <dl class="definition-list flex">
        <div class="list-item">
            <dt>Edital</dt>
            <dd>{{ eleicao.edital }}</dd>
        </div>
    </dl>

    <h3>Formulário de inscrição:</h3>
    <dl class="definition-list flex">
        <div class="list-item">
            <dt>Candidato</dt>
            <dd>{{ user.get_profile.nome }}</dd>
        </div>
        <div class="list-item">
            <dt>Matrícula</dt>
            <dd>{{ user.username }}</dd>
        </div>
        {% if cargo %}
            ]<div class="list-item">
                <dt>Cargo</dt>
                <dd>{{ cargo }}</dd>
            </div>
        {% endif %}
        <div class="list-item">
            <dt>Campus</dt>
            <dd>{{ campus }}</dd>
        </div>
    </dl>
    {% render_form form %}

{% endblock %}
