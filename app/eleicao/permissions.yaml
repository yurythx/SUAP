Coordenador de Edital:
  description: Responsável pelo gerenciamento  (cadastro, edição e listagem) dos registros básicos necessários à realização de um eleição tais como editais, candidatos e chapas. Cabe ao Coordenador de Edital também a responsabilidade de validar os votos realizados pelos usuários.
  eleicao:
    candidato:
    - add_candidato
    - view_candidato
    - change_candidato
    - validar_candidato
    chapa:
    - add_chapa
    - view_chapa
    - change_chapa
    - validar_chapa
    edital:
    - view_edital
    - change_edital
    eleicao:
    - add_eleicao
    - view_eleicao
    - change_eleicao
    - delete_eleicao
    voto:
    - validar_voto
Criador de Eleição:
  description: Responsável pelo gerenciamento (cadastro, edição e listagem) dos registros básicos necessários à realização de um eleição tais como editais, candidatos e chapas. Cabe ao Criador de Eleição também a responsabilidade de validar os votos realizados pelos usuários.
  eleicao:
    candidato:
    - add_candidato
    - view_candidato
    - change_candidato
    - validar_candidato
    chapa:
    - add_chapa
    - view_chapa
    - change_chapa
    - validar_chapa
    edital:
    - view_edital
    - change_edital
    - add_edital
    - delete_edital
    eleicao:
    - add_eleicao
    - view_eleicao
    - change_eleicao
    - delete_eleicao
    voto:
    - validar_voto
