{% extends super_template %}

{% block content %}

    {% for secao in modelo.get_secoes %}
        {% if secao.subsecao %}
            <h5>{{ secao.titulo }}</h5>
        {% else %}
            <br>
            <h2>{{ secao.titulo }}</h2>
        {% endif %}
        {% for conteudo in secao.get_conteudos %}
            <p>{{ conteudo|safe }}</p>
        {% endfor %}
    {% endfor %}

{% endblock %}
