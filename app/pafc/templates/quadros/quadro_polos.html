<table class="my-3">
    <thead>
        <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>Endereço</th>
            <th>Vagas ofertadas</th>
            <th>Tipo</th>
        </tr>
    </thead>
    <tbody>
    {% for polo_pafc in polos %}
        <tr>
            <td>{{ polo_pafc.polo.codigo_censup|format }}</td>
            <td>{{ polo_pafc.polo.descricao|format }}</td>
            <td>{{ polo_pafc.polo.get_endereco|format|normalizar }}</td>
            <td>{{ polo_pafc.vagas_ofertadas }}</td>
            <td>{{ polo_pafc.get_tipo_display }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
