<table class="my-3">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Turno</th>
            <th>Quantidade de períodos</th>
        </tr>
    </thead>
    <tbody>
        {% for matriz in matrizes %}
            <tr>
                <td>{{ matriz.matriz_ppc.nome }}</td>
                <td>{{ matriz.matriz_ppc.turno|format }}</td>
                <td>{{ matriz.matriz_ppc.quantidade_periodos }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
