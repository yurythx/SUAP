{% extends super_template %}
{% block content %}
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Perfis</th>
                    <th class="no-print">Opções</th>
                </tr>
            </thead>
            <tbody>
                {% for categoria in categorias %}
                    <tr>
                        <td>{{ categoria|format }}</td>
                        <td>{{ categoria.get_perfis_display|format }}</td>
                        <td class="no-print">
                            <a class="btn success"
                               href="/professor_sv/cadastrar_vaga/{{ categoria.id }}">Selecionar</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
