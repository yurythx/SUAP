<dl class="definition-list flex">
    {% if exibir_cod_vaga %}
        <div class="list-item">
            <dt>Código</dt>
            <dd>
                <a href="{% url 'gerenciar_vaga' contrato.vaga.id %}">{{ contrato.vaga.codigo|format }}</a>
            </dd>
        </div>
    {% endif %}
    <div class="list-item">
        <dt>Categoria</dt>
        <dd>
            {{ vaga.categoria|format }}
        </dd>
    </div>
    <div class="list-item">
        <dt>Grupo dono</dt>
        <dd>
            {{ vaga.grupo_dono|format }}
        </dd>
    </div>
    <div class="list-item">
        <dt>Tomador atual</dt>
        <dd>
            {{ vaga.get_emprestimo_str|format }}
        </dd>
    </div>
    <div class="list-item">
        <dt>Ocupada</dt>
        <dd>
            {{ vaga.estah_ocupada|format }}
        </dd>
    </div>
    <div class="list-item">
        <dt>Ativo</dt>
        <dd>
            {{ vaga.ativo|format }}
        </dd>
    </div>
</dl>
