{% extends super_template %}
{% block content %}
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Campus</th>
                    <th class="no-print">Opções</th>
                </tr>
            </thead>
            <tbody>
                {% for uo in uos %}
                    <tr>
                        <td>{{ uo|format }}</td>
                        <td class="no-print">
                            <a class="btn success"
                               href="/admin/professor_sv/grupo/add/?uo_id={{ uo.id }}">Selecionar</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
