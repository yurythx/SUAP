{% extends "admin/base_anonima.html" %}

{% block bodyclass %}fixed-centered{% endblock %}

{% block content %}

    {% render_form form %}

    <script>
        $('#id_todas_situacoes').change(function () {
            var selected_situacao = $('#id_todas_situacoes:checked').val();
            if (selected_situacao == "on"){
                $('#id_status').val(undefined);
                $('#id_status').prop("disabled", true);
            }
            else{
                $('#id_status').prop("disabled", false);
            }
        });

        $(document).ready(function() {
            var selected_status = $('#id_status').val();
            if (selected_status){
                $('#id_todas_situacoes').prop( "checked", false );;
            }

            $('#id_numero_protocolo').on('input', function(){
                var inputValue = $(this).val();
                if(inputValue.length){
                    $('input[type="date"]').not(this).prop('disabled', true);
                    $('input[type="text"]').not(this).prop('disabled', true).val('');
                    $('select').not(this).prop('disabled', true).val('');
                    $('select[name="tipo_processo"]').addClass('select2-disabled').trigger('change');
                } else {
                    $('input[type="date"], input[type="text"], select').prop('disabled', false);
                }
            });

            $("input.br-processoeletronico-widget").unmask();
            $("input.br-processoeletronico-widget").mask("99999.999999{{ mask_sufixo }}9999-99", {placeholder: "12345.123456{{ mask_sufixo }}2024-12"});
        });
    </script>

{% endblock %}
