{% with prazo_recebimento=tramite.prazorecebimentoprocesso_set.first %}
    {% if prazo_recebimento %}
    <p>
        <span class="fas fa-clock" aria-hidden="true"></span> Prazo para recebimento: {{ prazo_recebimento.limite|format }}
        {% if prazo_recebimento.decorrido %}
            <br> <span style="color:red">Prazo decorrido e processo recebido automaticamente.</span>
        {% endif %}
    </p>
    {% endif %}
{% endwith %}
