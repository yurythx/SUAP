{% extends super_template %}
{%block extrahead %}
<style>
    #circle {
      width: 25px;
      height: 25px;
      -webkit-border-radius: 25px;
      -moz-border-radius: 25px;
      border-radius: 25px;
    }
</style>
{% endblock %}
{% block content %}
    <table>
        <thead>
            <tr>
                <th>Cor</th>
                <th>Descrição</th>
                <th>Setor</th>
            </tr>
        </thead>
        <tbody>
            {% for rotulo in rotulos %}
                <tr>
                    <td>
                        <div id="circle" style="background:{{ rotulo.cor }}; color:#fff;">  </div> 
                    </td>
                    <td>{{ rotulo.descricao|default:"-" }}</td>
                    <td>{{ rotulo.setor }}</td>
                </tr>
            {% empty %}
                <p class="alert alert-warnning"> Nenhum Rótulo encontrado para o setor {{ setor}}.</p>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
