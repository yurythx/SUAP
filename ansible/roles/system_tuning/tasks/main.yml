---
- name: Aplicar sysctl para Redis, Django e carga institucional
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-suap.conf
    reload: true
  loop: "{{ sysctl_settings | dict2items }}"
  failed_when: false

- name: Configurar limites de file descriptors
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-suap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      * soft nofile 65536
      * hard nofile 65536
      root soft nofile 65536
      root hard nofile 65536

- name: Criar arquivo de swap extra
  ansible.builtin.command:
    cmd: fallocate -l {{ swap_size_gb | default(4) }}G /swapfile
    creates: /swapfile
  when: suap_extra_swap | bool

- name: Permissões do swapfile
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"
  when: suap_extra_swap | bool

- name: Formatar swapfile
  ansible.builtin.command:
    cmd: mkswap /swapfile
  args:
    creates: /swapfile
  register: suap_mkswap
  changed_when: suap_mkswap.rc == 0 and 'UUID' in (suap_mkswap.stdout | default(''))
  failed_when: false
  when: suap_extra_swap | bool

- name: Ativar swap
  ansible.builtin.command:
    cmd: swapon /swapfile
  register: suap_swapon
  changed_when: suap_swapon.rc == 0
  failed_when: false
  when: suap_extra_swap | bool

- name: Persistência do swap no fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present
  when: suap_extra_swap | bool
