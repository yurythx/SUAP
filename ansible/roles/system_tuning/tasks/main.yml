---
- name: Aplicar sysctl para Redis, Django e carga institucional
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-suap.conf
    reload: true
  loop: "{{ sysctl_settings | dict2items }}"

- name: Configurar limites de file descriptors
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-suap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      * soft nofile 1048576
      * hard nofile 1048576
      root soft nofile 1048576
      root hard nofile 1048576

- name: Instalar utilitários de operação
  ansible.builtin.apt:
    name:
      - htop
      - iotop
      - sysstat
      - unattended-upgrades
      - qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Garantir qemu-guest-agent ativo
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: Criar arquivo de swap (homolog 4GB RAM)
  ansible.builtin.command:
    cmd: fallocate -l {{ swap_size_gb | default(4) }}G /swapfile
    creates: /swapfile

- name: Permissões do swapfile
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Formatar swapfile
  ansible.builtin.command:
    cmd: mkswap /swapfile
  args:
    creates: /swapfile
  register: suap_mkswap
  changed_when: suap_mkswap.rc == 0 and 'UUID' in (suap_mkswap.stdout | default(''))
  failed_when: false

- name: Ativar swap
  ansible.builtin.command:
    cmd: swapon /swapfile
  register: suap_swapon
  changed_when: suap_swapon.rc == 0
  failed_when: false

- name: Persistência do swap no fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present
