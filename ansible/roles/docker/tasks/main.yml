---
- name: Remover pacotes Docker conflitantes
  ansible.builtin.apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
      - docker-doc
      - docker-compose
      - podman-docker
    state: absent

- name: Instalar dependências do repositório Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Criar diretório de keyrings APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar chave GPG oficial do Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true

- name: Configurar repositório oficial Docker CE
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
    content: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable

- name: Atualizar cache APT
  ansible.builtin.apt:
    update_cache: true

- name: Instalar Docker Engine CE e Compose Plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Configurar daemon Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "5"
        },
        "live-restore": true,
        "userland-proxy": false,
        "no-new-privileges": true
      }
  notify: restart docker

- name: Garantir serviço Docker ativo
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Adicionar usuário de deploy ao grupo docker
  ansible.builtin.user:
    name: "{{ suap_deploy_user }}"
    groups: docker
    append: true
