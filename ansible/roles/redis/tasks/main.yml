---
- name: Teto, política e persistência do Redis
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^{{ item.key }} "
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - { key: maxmemory, value: "{{ redis_maxmemory }}" }
    - { key: maxmemory-policy, value: noeviction }
    - { key: appendonly, value: "yes" }
    - { key: appendfsync, value: everysec }
    - { key: bind, value: "127.0.0.1 {{ redis_bind_ip }}" }
  notify: restart redis

- name: Garantir Redis ativo
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
