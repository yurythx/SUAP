---
- name: Instalar UFW, fail2ban e AppArmor
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - apparmor
      - apparmor-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Endurecer SSH (sem root e sem senha)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-suap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PermitRootLogin {{ ssh_permit_root_login }}
      PasswordAuthentication {{ ssh_password_authentication }}
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      UsePAM yes
      X11Forwarding no
      AllowTcpForwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
      LoginGraceTime 30
  notify: reload ssh

- name: Política UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Política UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Liberar portas TCP no UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_tcp_ports }}"

- name: Habilitar UFW
  community.general.ufw:
    state: enabled

- name: Configurar fail2ban para SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5
      backend = systemd

      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = %(sshd_log)s
      maxretry = 5
  notify: restart fail2ban

- name: Garantir fail2ban ativo
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Desabilitar serviços desnecessários quando existirem
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - bluetooth
    - cups
  failed_when: false
