---
- name: Endurecer SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-suap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PermitRootLogin {{ ssh_permit_root_login }}
      PasswordAuthentication {{ ssh_password_authentication }}
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      UsePAM yes
      X11Forwarding no
      AllowTcpForwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
      LoginGraceTime 30
  notify: reload ssh

- name: UFW presente
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: suap_ufw

- name: Política UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny
  when: suap_ufw.stat.exists

- name: Política UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow
  when: suap_ufw.stat.exists

- name: Liberar portas TCP no UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    from_ip: "{{ item.from | default(omit) }}"
  loop: "{{ ufw_rules }}"
  when: suap_ufw.stat.exists

- name: Habilitar UFW
  community.general.ufw:
    state: enabled
  when: suap_ufw.stat.exists

- name: fail2ban presente
  ansible.builtin.stat:
    path: /usr/bin/fail2ban-client
  register: suap_fail2ban

- name: Configurar fail2ban para SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5
      backend = systemd

      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = %(sshd_log)s
      maxretry = 5
  notify: restart fail2ban
  when: suap_fail2ban.stat.exists

- name: Garantir fail2ban ativo
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: suap_fail2ban.stat.exists

- name: Desabilitar serviços desnecessários quando existirem
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - bluetooth
    - cups
  failed_when: false
