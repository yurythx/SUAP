---
- name: reload ssh
  ansible.builtin.shell: |
    set -euo pipefail
    sshd -t
    if systemctl is-active --quiet ssh.socket; then
      exit 0
    fi
    systemctl reload ssh
  args:
    executable: /bin/bash
  changed_when: false

- name: restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
