---
- name: Recusar inventário incompleto
  hosts: all
  gather_facts: false
  tasks:
    - name: Produção só aplica com IP real e state próprio
      ansible.builtin.assert:
        that:
          - ansible_host is not search('PREENCHER')
          - suap_app_ip is not search('PREENCHER')
          - suap_internal_cidr is not search('PREENCHER')
          - redis_bind_ip is not search('PREENCHER')
        fail_msg: Preencha os IPs e a rede deste ambiente antes de aplicar o Ansible.

- name: Ajuste de sistema
  hosts: all
  become: true
  roles:
    - role: system_tuning
      tags: [system, tuning]

- name: SSH, firewall e fail2ban
  hosts: all
  become: true
  roles:
    - role: hardening
      tags: [security, hardening]

- name: PostgreSQL
  hosts: suap_db
  become: true
  roles:
    - role: postgres
      tags: [postgres, db]

- name: Redis
  hosts: suap_redis
  become: true
  roles:
    - role: redis
      tags: [redis]

- name: Gunicorn, Celery e código
  hosts: suap_app
  become: true
  roles:
    - role: suap_runtime
      tags: [suap, app]

- name: Nginx de ingresso
  hosts: suap_lb
  become: true
  roles:
    - role: nginx_lb
      tags: [nginx, lb]
