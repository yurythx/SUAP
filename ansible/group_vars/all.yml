---
suap_base_dir: /opt/suap
suap_code_dir: /opt/suap/src
suap_extra_swap: false
suap_sync_code: false

ssh_permit_root_login: prohibit-password
ssh_password_authentication: "no"

sysctl_settings:
  vm.overcommit_memory: "1"
  vm.swappiness: "10"
  net.core.somaxconn: "4096"
  fs.file-max: "2097152"

ufw_rules:
  - port: "22"
