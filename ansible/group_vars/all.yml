---
suap_deploy_user: deploy
suap_base_dir: /opt/suap
suap_app_dir: "{{ suap_base_dir }}/app"
suap_compose_dir: "{{ suap_base_dir }}/compose"
suap_data_dir: "{{ suap_base_dir }}/data"
suap_backups_dir: "{{ suap_base_dir }}/backups"

# UID/GID oficial da imagem SUAP (www-data)
suap_app_uid: 33
suap_app_gid: 33

suap_local_app_src: "{{ playbook_dir }}/../app"
suap_local_compose_src: "{{ playbook_dir }}/../compose"

suap_compose_file: docker-compose.prod.yml
suap_compose_project: suap
suap_env_file: "{{ suap_compose_dir }}/.env"
suap_systemd_unit: suap-compose.service

sysctl_settings:
  vm.overcommit_memory: "1"
  vm.swappiness: "10"
  net.core.somaxconn: "4096"
  fs.file-max: "2097152"

ufw_allowed_tcp_ports:
  - "22"
  - "80"
  - "443"

ssh_permit_root_login: "no"
ssh_password_authentication: "no"
