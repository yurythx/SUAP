[controle]
ansible-ctl ansible_host=PREENCHER-IP-CTL ansible_user=root

[suap_lb]
suap-lb ansible_host=PREENCHER-IP-LB ansible_user=root

[suap_app]
suap-app ansible_host=PREENCHER-IP-APP ansible_user=root

[suap_db]
suap-db ansible_host=PREENCHER-IP-DB ansible_user=root

[suap_redis]
suap-redis ansible_host=PREENCHER-IP-REDIS ansible_user=root

[suap_worker]
suap-worker ansible_host=PREENCHER-IP-WORKER ansible_user=root

[suap:children]
suap_lb
suap_app
suap_db
suap_redis
suap_worker

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_ed25519_sei_homolog
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
