[controle]
ansible-ctl ansible_host=192.168.110.5 ansible_user=root

[suap_lb]
suap-lb ansible_host=192.168.110.10 ansible_user=root

[suap_app]
suap-app ansible_host=192.168.110.20 ansible_user=root

[suap_db]
suap-db ansible_host=192.168.110.30 ansible_user=root

[suap_redis]
suap-redis ansible_host=192.168.110.40 ansible_user=root

[suap:children]
suap_lb
suap_app
suap_db
suap_redis

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_ed25519_sei_homolog
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
